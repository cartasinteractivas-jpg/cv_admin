<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050914" />
    <title>WebPocket · La página web de bolsillo</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #030611;
        color: #f8fafc;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: radial-gradient(
          circle at 50% 0,
          #17396a 0,
          #061124 33%,
          #02040b 85%
        );
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .pocket {
        --main: #38bdf8;
        --second: #a78bfa;
        --bg: #07101e;
        --text: #f8fafc;
        isolation: isolate;
        overflow: hidden;
        position: relative;
        width: min(100%, 430px);
        height: min(92vh, 840px);
        height: min(92dvh, 840px);
        min-height: 680px;
        border: 1px solid color-mix(in srgb, var(--main) 60%, #cbd5e1);
        border-radius: 31px;
        background: var(--bg);
        box-shadow:
          0 24px 90px color-mix(in srgb, var(--main) 30%, transparent),
          inset 0 0 0 1px #fff1;
      }
      /* Móvil: ocupa toda la pantalla (no se ve encogido) */
      @media (max-width: 520px) {
        .stage {
          padding: 0;
          place-items: stretch;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .pocket {
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .loader-overlay {
          border-radius: 0;
        }
        .app {
          padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        }
      }
      @media (max-width: 520px) and (max-height: 700px) {
        .content h2 {
          font-size: clamp(28px, 9vw, 42px);
        }
        .desc {
          font-size: 12px;
        }
        .format-caption {
          display: none;
        }
        .action {
          min-height: 44px;
        }
      }
      .background {
        position: absolute;
        inset: 0;
        z-index: -4;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: linear-gradient(145deg, var(--main), var(--bg));
        /* Videos nítidos y vivos: sin filtro oscuro agresivo */
        filter: brightness(1.05) saturate(1.15) contrast(1.05);
      }
      .shade {
        position: absolute;
        inset: 0;
        z-index: -3;
        pointer-events: none;
        /* Gradiente suave solo para legibilidad del texto, sin oscurecer el video */
        background: linear-gradient(
          180deg,
          #03071188 0%,
          #07101e18 22%,
          #06102410 48%,
          #02030bcc 100%
        );
      }
      .app {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 17px 14px 15px;
        gap: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.7px;
      }
      .brand small,
      .eyebrow {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 850;
        letter-spacing: 1.2px;
        color: #dbeafe;
      }
      .status-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .status {
        border: 1px solid #fde0477d;
        border-radius: 999px;
        padding: 4px 7px;
        background: #3f2c0399;
        color: #fef08a;
        font-size: 8px;
        font-weight: 850;
      }
      .status.ok {
        border-color: #4ade8080;
        background: #052e16a8;
        color: #bbf7d0;
      }
      .counter {
        border: 1px solid #fff4;
        border-radius: 999px;
        padding: 8px 10px;
        background: #06111eb8;
        backdrop-filter: blur(12px);
        font-size: 10px;
        font-weight: 900;
      }
      .menu {
        display: flex;
        gap: 6px;
        padding: 8px;
        max-width: 100%;
        overflow: auto;
        scroll-behavior: smooth;
        border: 1px solid #fff3;
        border-radius: 16px;
        background: color-mix(in srgb, var(--bg) 64%, transparent);
        backdrop-filter: blur(16px);
        scrollbar-width: none;
      }
      .menu::-webkit-scrollbar {
        display: none;
      }
      .menu.side {
        position: absolute;
        left: 14px;
        top: 132px;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.side-right {
        position: absolute;
        right: 14px;
        top: 132px;
        left: auto;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.floating-right {
        position: absolute;
        right: 14px;
        top: 142px;
        left: auto;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.floating-left {
        position: absolute;
        left: 14px;
        top: 142px;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.bottom {
        order: 4;
        margin-top: auto;
      }
      .menu.centered {
        align-self: center;
        max-width: 280px;
      }
      .menu button {
        border: 0;
        border-radius: 9px;
        padding: 8px 9px;
        background: transparent;
        color: var(--text);
        font-size: 9px;
        font-weight: 850;
        white-space: nowrap;
      }
      .menu button:hover,
      .menu button.active {
        background: color-mix(in srgb, var(--main) 76%, #06111e);
      }
      .content {
        margin-top: auto;
        padding: 8px 2px;
        color: var(--text);
        text-shadow: 0 2px 15px #020617;
      }
      .content.shifted {
        margin-left: 111px;
      }
      .content.shifted-right {
        margin-right: 111px;
      }
      .eyebrow {
        color: var(--second);
      }
      .content h2 {
        margin: 7px 0;
        font-size: clamp(37px, 10vw, 56px);
        line-height: 0.88;
        letter-spacing: -2.8px;
        max-width: 9ch;
      }
      .role {
        margin: 0 0 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .desc {
        max-width: 32ch;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 580;
      }
      .location {
        margin: 11px 0 0;
        font-size: 11px;
        font-weight: 750;
      }
      .format-caption {
        margin: 12px 0 0;
        font-size: 8px;
        font-weight: 850;
        letter-spacing: 1px;
        opacity: 0.75;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .action {
        min-height: 47px;
        border: 1px solid #fff4;
        border-radius: 15px;
        background: #06111eb8;
        color: #fff;
        font-size: 12px;
        font-weight: 850;
        backdrop-filter: blur(14px);
      }
      .action.primary {
        border-color: transparent;
        color: #08101b;
        background: linear-gradient(135deg, var(--main), var(--second));
        box-shadow: 0 10px 26px color-mix(in srgb, var(--main) 40%, transparent);
      }
      .always-actions {
        display: flex;
        gap: 7px;
        justify-content: flex-end;
      }
      .always-actions button {
        border: 0;
        border-radius: 999px;
        padding: 9px 13px;
        font-size: 10px;
        font-weight: 900;
      }
      .register {
        background: #fde047;
        color: #1e1b0b;
      }
      .login {
        background: #4ade80;
        color: #052e16;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dots {
        display: flex;
        gap: 5px;
      }
      .dot {
        border: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff66;
        padding: 0;
      }
      .dot.active {
        width: 20px;
        background: var(--main);
      }
      .foot-note {
        font-size: 8px;
        letter-spacing: 0.8px;
        font-weight: 850;
        opacity: 0.7;
      }
      .overlay {
        display: none;
        position: absolute;
        z-index: 10;
        inset: 0;
        padding: 12px;
        background: #01050ba8;
        backdrop-filter: blur(5px);
      }
      .overlay.open {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 6px;
        padding-bottom: 12px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .overlay.open > .sheet {
        margin-top: 0;
        align-self: flex-start;
      }
      .overlay.open.sheet-bottom {
        align-items: flex-end;
        padding-top: 12px;
      }
      .sheet {
        max-height: min(92%, calc(100% - 12px));
        width: 100%;
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #e2e8f0);
        border-radius: 23px;
        padding: 18px;
        background: color-mix(in srgb, var(--bg) 92%, #020617);
        box-shadow: 0 18px 50px #0009;
        margin-bottom: 8px;
      }
      /* Login / registro: arriba y centrado (teclado móvil no tapa) */
      .sheet.sheet-access {
        max-height: none;
        margin-top: 4px;
      }
      
      .sheet.sheet-account {
        max-height: 100% !important;
        height: 100%;
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        padding-bottom: 10px;
      }
      .sheet.sheet-account .account-tabs {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px 2px 10px;
        margin: 0 0 8px;
        scrollbar-width: none;
      }
      .sheet.sheet-account .account-tabs::-webkit-scrollbar { display: none; }
      .sheet.sheet-account .account-tabs button {
        flex: 0 0 auto;
        white-space: nowrap;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 800;
        border: 1px solid #ffffff33;
        background: #ffffff12;
        color: #e2e8f0;
        transition: 0.2s ease;
      }
      .sheet.sheet-account .account-tabs button.active {
        background: linear-gradient(135deg, var(--main, #38bdf8), var(--second, #a78bfa));
        color: #041018;
        border-color: transparent;
        box-shadow: 0 0 16px color-mix(in srgb, var(--main) 55%, transparent);
        transform: scale(1.04);
      }
      .sheet.sheet-account #account-body {
        flex: 1;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 20px;
      }
      .admin-switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #fff3;
        background: #0b1220;
        margin-bottom: 12px;
      }
      .admin-switch b { display: block; font-size: 13px; }
      .admin-switch small { color: #94a3b8; font-size: 11px; }
      .switch {
        position: relative;
        width: 48px;
        height: 28px;
        flex-shrink: 0;
      }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch span {
        position: absolute;
        inset: 0;
        background: #334155;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.2s;
      }
      .switch span:before {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      .switch input:checked + span { background: #22c55e; }
      .switch input:checked + span:before { transform: translateX(20px); }

      .sheet.sheet-access .field input:focus {
        scroll-margin-top: 24px;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.8px;
      }
      .sheet p {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #fff1;
        color: #fff;
        font-size: 19px;
      }
      .card-list {
        display: grid;
        gap: 9px;
      }
      .card {
        padding: 12px;
        border: 1px solid #fff2;
        border-radius: 14px;
        background: #fff1;
      }
      .card b {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .card p {
        margin: 0;
        font-size: 12px;
      }


      /* Variantes de carrito MUY distintas */
      .cart-carrusel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 2px 12px;
        -webkit-overflow-scrolling: touch;
      }
      .cart-carrusel .card.product {
        min-width: 82%;
        scroll-snap-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        overflow: hidden;
      }
      .cart-carrusel .card.product img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 14px 14px 0 0;
      }
      .cart-carrusel .card.product > div {
        padding: 0 12px 12px;
      }
      .cart-grilla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cart-grilla .card.product {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: center;
      }
      .cart-grilla .card.product img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
      }
      .cart-grilla .qty {
        justify-content: center;
      }
      .cart-lista {
        display: grid;
        gap: 8px;
      }
      .cart-lista .card.product {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }
      .cart-lista .card.product img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        object-fit: cover;
      }
      .cart-lista .qty {
        flex-direction: column;
        margin-top: 0;
      }
      .cart-vitrina {
        display: grid;
        gap: 12px;
      }
      .cart-vitrina .card.product {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #fff3);
        box-shadow: 0 0 24px color-mix(in srgb, var(--main) 25%, transparent);
      }
      .cart-vitrina .card.product img {
        width: 100%;
        height: 190px;
        object-fit: cover;
      }
      .cart-vitrina .card.product > div {
        padding: 0 14px 14px;
        text-align: center;
      }
      .cart-vitrina .qty {
        justify-content: center;
      }
      .cart-market {
        display: grid;
        gap: 10px;
      }
      .cart-market .card.product {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        align-items: center;
        border: 1px solid color-mix(in srgb, var(--main) 45%, #fff2);
        background: linear-gradient(135deg, #0a1020ee, color-mix(in srgb, var(--main) 12%, #0a1020));
      }
      .cart-market .card.product img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        object-fit: cover;
      }
      .cart-hint {
        font-size: 10px;
        opacity: 0.75;
        margin: 0 0 8px;
        letter-spacing: 0.3px;
      }
      .product {
        gap: 9px;
        align-items: center;
      }
      .product img {
        object-fit: cover;
        border-radius: 12px;
        background: #0f172a;
      }
      .card-list .card.product {
        display: grid;
        grid-template-columns: 62px 1fr auto;
      }
      .card-list .card.product img {
        width: 62px;
        height: 62px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 7px;
      }
      .qty button {
        width: 25px;
        height: 25px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #ffffff12;
        color: #fff;
        font-weight: 900;
      }
      .gallery {
        display: grid;
        gap: 12px;
      }
      .gallery iframe {
        width: 100%;
        aspect-ratio: 16/9;
        border: 0;
        border-radius: 13px;
        background: #000;
      }
      .form {
        display: grid;
        gap: 11px;
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field label {
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.4px;
        color: #dbeafe;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid #fff3;
        border-radius: 12px;
        padding: 11px;
        background: #050a14d9;
        color: #fff;
        outline: none;
      }
      .field textarea {
        min-height: 76px;
        resize: vertical;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--main);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--main) 20%, transparent);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .colors {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .colors input {
        height: 42px;
        padding: 4px;
      }
      .price-box {
        padding: 13px;
        border: 1px solid #a3e63575;
        border-radius: 15px;
        background: #19321a88;
      }
      .price-box strong {
        display: block;
        color: #bef264;
        font-size: 22px;
      }
      .submit {
        border: 0;
        border-radius: 14px;
        padding: 13px;
        background: linear-gradient(135deg, #fde047, #facc15);
        color: #1c1917;
        font-weight: 950;
      }
      .message {
        margin: 0;
        padding: 10px;
        border: 1px solid #fff2;
        border-radius: 12px;
        background: #fff1;
        color: #e2e8f0;
        font-size: 12px;
      }
      .message.error {
        border-color: #fb718580;
        color: #fecaca;
        background: #450a0a80;
      }
      .message.ok {
        border-color: #4ade8080;
        color: #bbf7d0;
        background: #052e1680;
      }
      .message.warn {
        border-color: #fde04780;
        color: #fef08a;
        background: #3f2c0380;
      }
      .chat-log {
        display: grid;
        gap: 8px;
        max-height: 270px;
        overflow: auto;
        margin: 10px 0;
      }
      .bubble {
        max-width: 90%;
        padding: 10px;
        border-radius: 12px;
        background: #fff1;
        font-size: 12px;
        line-height: 1.45;
      }
      .bubble.user {
        margin-left: auto;
        color: #06111e;
        background: linear-gradient(135deg, var(--main), var(--second));
      }
      .hidden {
        display: none !important;
      }
      /* Password reveal */
      .pass-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .pass-wrap input {
        width: 100%;
        padding-right: 44px;
      }
      .pass-toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: #ffffff18;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 800;
        min-width: 36px;
      }
      /* Loading splash */
      .loader-overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #020611f5, #061124f0 40%, #030713fa);
        border-radius: 31px;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      .loader-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-ring {
        width: 58px;
        height: 58px;
        border: 3px solid #ffffff22;
        border-top-color: var(--main, #38bdf8);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .loader-text {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.4px;
        color: #e2e8f0;
      }
      .loader-sub {
        font-size: 10px;
        opacity: 0.7;
        letter-spacing: 1px;
        font-weight: 700;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Inline wait spinner for forms */
      .wait-inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }

        }
        
        if (state.panel === "maps") {
          const q = p.maps || (p.direccion ? `https://maps.google.com/maps?q=${encodeURIComponent(p.direccion)}&z=15&output=embed` : "");

            if (p.maps && !/output=embed/i.test(p.maps)) {
              const u = new URL(p.maps);
              if (/google\.[^/]*\/maps/i.test(p.maps) || u.hostname.includes("google")) {
                const qq = u.searchParams.get("q") || p.direccion || u.pathname;
                embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(qq.replace(/^\//, ""))}&z=15&output=embed`;
              }
            } else if (p.direccion && !p.maps) {
              embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(p.direccion)}&z=15&output=embed`;
            }
          } catch {
            embedUrl = p.direccion
              ? `https://maps.google.com/maps?q=${encodeURIComponent(p.direccion)}&z=15&output=embed`
              : "";
          }
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">UBICACIÓN</span><h3>${esc(title(p))}</h3></div>${close}</div>${p.direccion ? `<p class="location" style="margin:0 0 10px">⌖ ${esc(p.direccion)}</p>` : ""}<div class="gallery"><iframe src="${esc(embedUrl)}" title="Mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="width:100%;aspect-ratio:1/1;border:0;border-radius:14px;background:#0a1020"></iframe></div><p class="message">Mapa dentro de WebPocket. Desliza o pellizca para explorar.</p></section></aside>`;
        }

        if (state.panel === "info") {
          const dir = p.direccion || "";

          const wa = tel ? `https://wa.me/51${tel.replace(/^51/, "")}` : "";
          const call = tel ? `tel:+${tel.startsWith("51") ? tel : "51" + tel}` : "";
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">CONTACTO</span><h3>Información</h3></div>${close}</div><div class="card-list">${dni ? `<article class="card"><b>DNI</b><p>${esc(dni)}</p></article>` : ""}${tel ? `<article class="card"><b>Teléfono</b><p>${esc(p.telefono || tel)}</p><div class="profile-tools" style="margin-top:10px"><a class="action primary" style="text-decoration:none" href="${esc(wa)}" target="_blank" rel="noreferrer">WhatsApp</a><a class="action" style="text-decoration:none" href="${esc(call)}">Llamar</a></div></article>` : ""}${dir ? `<article class="card"><b>Dirección</b><p>${esc(dir)}</p></article>` : ""}${!dni && !tel && !dir ? "<p>Sin datos de contacto.</p>" : ""}</div></section></aside>`;
        }

        if (state.panel === "products") {
          const products = productsFor(p).map((x, i) =>
            typeof x === "string"
              ? {
                  descripcion: x,
                  precio: [12, 18, 28, 35, 9][i] || 15,
                  foto: IMAGE_BY_DEMO[
                    Math.max(0, (p.numero_perfil || 5) - 5) % 4
                  ],
                }
              : x,
          );
          const cartStyle = (
            p.estilo_tarjetas ||
            format(p).estilo_tarjetas ||
            ""
          ).toLowerCase();
          const cartClass =
            cartStyle.includes("carrusel") ? "cart-carrusel" :
            cartStyle.includes("grilla") ? "cart-grilla" :
            cartStyle.includes("lista") ? "cart-lista" :
            cartStyle.includes("vitrina") ? "cart-vitrina" :
            cartStyle.includes("market") ? "cart-market" :
            "card-list";
          const cartHint =
            cartClass === "cart-carrusel" ? "Desliza → carrusel de productos" :
            cartClass === "cart-grilla" ? "Vista grilla · 2 columnas" :
            cartClass === "cart-lista" ? "Lista compacta" :
            cartClass === "cart-vitrina" ? "Vitrina grande · una foto protagonista" :
            cartClass === "cart-market" ? "Estilo market / pedido rápido" :
            "Productos";
          const total = Object.entries(state.cart).reduce(
            (n, [id, qty]) =>
              n +
              qty *
                (products.find((x) => (x.descripcion || "") === id)?.precio ||
                  0),
            0,
          );
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">CARRITO · ${esc((format(p).estilo_tarjetas || "productos").replace(/_/g, " ").toUpperCase())}</span><h3>${esc(title(p))}</h3></div>${close}</div><p class="cart-hint">${esc(cartHint)}</p><div class="${cartClass}">${products
            .map((x) => {

              return `<article class="card product"><img src="${esc(x.foto || IMAGE_BY_DEMO[Math.max(0, (p.numero_perfil || 5) - 5) % 4])}" alt="${esc(x.descripcion)}"><div><b>${esc(x.descripcion)}</b><p>S/ ${Number(x.precio || 0).toFixed(2)}</p><div class="qty"><button data-qty="-" data-id="${esc(x.descripcion)}">−</button><span>${qty}</span><button data-qty="+" data-id="${esc(x.descripcion)}">+</button></div></div></article>`;
            })
            .join(
              "",
            )}</div><div class="price-box"><strong>S/ ${total.toFixed(2)}</strong><p>Al continuar se preparará el mensaje con tus productos y cantidades para el WhatsApp del negocio.</p><button class="submit" data-order>Ver pedido seleccionado</button></div></section></aside>`;

        if (state.panel === "gallery") {

        }
        if (state.panel === "chat") {
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">CHAT IA · ORIENTACIÓN</span><h3>Consulta general</h3></div>${close}</div><p class="message">Información general. No reemplaza evaluación médica, diagnóstico ni atención de urgencia.</p><div id="chat-log" class="chat-log"><div class="bubble">${esc(DOCTOR_GREETING)}</div></div><form id="chat-form" class="form"><div class="grid2"><input name="question" placeholder="Escribe una consulta general" aria-label="Consulta general"><button class="submit">Enviar</button></div></form></section></aside>`;
        }
        if (state.panel === "register") return registerSheet();
        if (state.panel === "login") return loginSheet();
        if (state.panel === "account") return accountSheet();

      }
      function registerSheet() {
        const f = state.formats[0] || FALLBACK_FORMATS[0];
        return `<aside class="overlay open"><section class="sheet sheet-access"><div class="sheet-head"><div><span class="eyebrow">REGISTRO INICIAL</span><h3>Abre tu WebPocket</h3></div><button class="close" data-close>×</button></div><p>El registro solo crea tu acceso y registra el pago. Tus datos de CV o negocio, foto, video y QR se completan desde tu sesión personal luego de la activación.</p><form id="quick-register-form" class="form"><div class="grid2"><div class="field"><label>Usuario</label><input name="usuario" placeholder="Crea tu usuario"></div>${passField("clave", "Crea tu clave", "Clave")}</div><div class="grid2"><div class="field"><label>Tipo</label><select name="tipoPerfil"><option value="CV">CV personal</option><option value="NEGOCIO">Negocio</option></select></div><div class="field"><label>Periodo</label><select name="periodoMeses"><option value="3">3 meses</option><option value="6">6 meses</option><option value="12">1 año</option></select></div></div><div id="business-cart-choice" class="card hidden"><b>Carrito de compras</b><p>Agrega S/ 10 e incluye hasta 10 productos. Los productos adicionales cuestan S/ 5 cada uno.</p><label><input name="carrito" type="checkbox"> Quiero activar carrito al validar mi pago</label></div><p class="message">Formato, colores y tipografía los eliges después, al ingresar a tu perfil.</p>${state.registroGratis ? `<p class="message ok">Registro <b>gratis</b>. No necesitas comprobante; tu cuenta se activa al registrarte.</p>` : `<div class="price-box"><span class="eyebrow">PAGO POR YAPE</span><strong id="quick-total">S/ 40.00</strong><p id="quick-detail">CV por 3 meses. Yape: 967 188 120.</p></div><div class="field"><label>Comprobante Yape</label><input name="receipt" type="file" accept="image/*,.pdf"></div>`}<p class="message">No se generará QR aquí. El administrador revisará el pago; cuando active tu cuenta podrás ingresar, completar tu perfil y obtener tu QR propio.</p><p id="quick-register-message" class="message hidden"></p><button class="submit">Registrar solicitud</button></form></section></aside>`;
      }
      function loginSheet() {
        return `<aside class="overlay open"><section class="sheet sheet-access"><div class="sheet-head"><div><span class="eyebrow">ACCESO</span><h3>Cliente o administrador</h3></div><button class="close" data-close>×</button></div><p class="message" style="margin-top:0">Admin por defecto: <b>admin</b> / <b>admin123</b></p><form id="access-form" class="form"><div class="field"><label>Usuario</label><input name="usuario" placeholder="Tu usuario"></div>${passField("clave", "Tu clave", "Clave")}<p id="access-message" class="message hidden"></p><button class="submit" style="background:linear-gradient(135deg,#4ade80,#22c55e)">Ingresar</button></form></section></aside>`;
      }
      const formatOptions = () =>

      const profileForm = (c) =>

orm>`;
        if (tab === "media")
          return `<div class="form"><p>Sube foto, video o CV. Cada archivo acepta hasta 15 MB. El video que subas queda pendiente para que el administrador lo apruebe o reemplace.</p><form id="media-form" class="form"><div class="field"><label>Tipo de archivo</label><select name="kind"><option value="foto">Foto de perfil</option><option value="video">Video</option>${!isBusiness ? '<option value="cv">Curriculum PDF</option>' : ""}</select></div><div class="field"><label>Archivo</label><input name="file" type="file" accept="image/*,video/mp4,video/webm,.pdf"></div><button class="submit">Subir archivo</button></form></div>`;

          const qaRows = (rows || "").split("\n").map((l) => l.trim()).filter(Boolean);
          const qaInputs = (qaRows.length ? qaRows : [""]).map((row) => {

            return `<div class="grid2" data-qa-row><input data-qa-q placeholder="Pregunta" value="${esc((pq || "").trim())}"><input data-qa-a placeholder="Respuesta" value="${esc((rs || "").trim())}"></div><button type="button" class="action" data-remove-qa>Quitar</button>`;
          }).join("");
          return `<form id="questions-form" class="form"><div class="field"><label>Modo</label><select name="mode" id="qa-mode"><option value="PRECONFIGURADA" ${ai ? "" : "selected"}>Preguntas predefinidas (pregunta + respuesta)</option><option value="IA" ${ai ? "selected" : ""}>Chat IA — solo prompt (S/ 10 adicional)</option></select></div><p class="message warn">Chat IA requiere pago validado en <b>Servicios</b>. Las preguntas predefinidas puedes agregar todas las que quieras.</p><div id="qa-predef" class="${ai ? "hidden" : ""}"><div class="field"><label>Preguntas y respuestas</label><div id="qa-list" class="form">${qaInputs || '<div class="grid2" data-qa-row><input data-qa-q placeholder="Pregunta"><input data-qa-a placeholder="Respuesta"></div>'}</div><button type="button" class="action" id="qa-add">+ Agregar pregunta</button><input type="hidden" name="questions" id="qa-hidden"></div></div><div id="qa-ia" class="${ai ? "" : "hidden"}"><div class="field"><label>Instrucciones / prompt para la IA</label><textarea name="prompt" placeholder="Ej: Responde en español, breve, sobre mi servicio de…">${esc(ai?.prompt)}</textarea></div><div class="field"><label>Conocimiento extra (opcional)</label><textarea name="knowledge" placeholder="Datos de tu negocio o CV que la IA debe conocer">${esc(ai?.conocimiento)}</textarea></div></div><button class="submit">Guardar</button></form>`;
        }
        if (tab === "youtube") {
          const links = (a.links || [])
            .filter((x) => /video|youtube|vimeo|mp4|gallery|enlace/i.test(String(x.tipo_enlace || "video")))
            .map((x) => x.url || x.valor_enlace)
            .join("\n");
          const urls = String(links || "").split(/\n/).map((x) => x.trim()).filter(Boolean);
          const boxes = (urls.length ? urls : [""]).map((u, i) => `<div class="field" data-video-row><label>Video ${i + 1}</label><div class="grid2"><input data-video-url type="url" placeholder="https://…" value="${esc(u)}"><button type="button" class="action" data-remove-video>Quitar</button></div></div>`).join("");
          return `<form id="youtube-form" class="form"><p>Agrega videos uno por uno (YouTube, Vimeo, MP4, etc.).</p><div id="video-list">${boxes}</div><button type="button" class="action" id="video-add">+ Añadir más video</button><button class="submit" style="margin-top:12px">Guardar videos</button></form>`;

      function accountSheet() {

        return `<aside class="overlay open"><section class="sheet sheet-access sheet-account"><div class="sheet-head"><div><span class="eyebrow">MI WEBPOCKET</span><h3>${esc(c.nombre || c.negocio || state.auth?.client?.nombre || "Mi perfil")}</h3></div><button class="close" data-close>×</button></div>${pending ? '<p class="message">Tu cuenta está pendiente de validación manual de pago. Puedes guardar tus datos, pero tu perfil y QR público se activan después de la revisión.</p>' : '<p class="message ok">Tu cuenta está activa. Los cambios guardados permanecen disponibles para modificar cuando quieras.</p>'}<div class="menu centered account-tabs">${["profile:Perfil","media:Medios","questions:Preguntas","youtube:Videos"].concat(isBusiness?["products:Carrito"]:[]).concat(["extras:Servicios","qr:QR"]).map((x)=>{const [id,lab]=x.split(":");const on=(state.accountTab||"profile")===id?"active":"";return `<button class="${on}" data-account-tab="${id}">${lab}</button>`;}).join("")}</div><div id="account-body">${accountTab(state.accountTab || "profile")}</div></section></aside>`;

      function adminSheet() {

          clients = a.clients || [],

          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">ADMINISTRACIÓN</span><h3>Precios de servicios</h3></div><button class="close" data-close>×</button></div>${tabs}<form id="plans-form" class="form">${(a.plans || []).length ? (a.plans || []).map(

"experience" : questions ? "questions" : "none"}">${p.chat ? "Consulta al doctor" : products ? "Ver productos" : experiences ? "Ver experiencia" : questions ? "Pregúntame" : "Ver perfil"}</button><button type="button" class="action" data-next>Otro perfil</button></div>${isCV ? `<div class="profile-tools"><button type="button" data-share-cv>Compartir CV</button><button type="button" data-download-cv>Bajar CV</button></div>` : (products ? `<div class="profile-tools"><button type="button" data-panel="products">Ver carrito</button>${p.direccion ? '<button type="button" data-panel="info">Dirección</button>' : ""}</div>` : "")}<div class="footer"><div class="dots">${state.profiles.map((_, i) => `<button class="dot ${i === state.index ? "active" : ""}" data-profile="${i}" aria-label="Perfil ${i + 1}"></button>`).join("")}</div><span class="foot-note">WEBPOCKET · LA PÁGINA WEB DE BOLSILLO</span></div><div class="always-actions"><button class="register" data-panel="register">Registrar</button><button class="login" data-panel="login">Ingresar</button></div>${renderPanel(p)}`;

            if (navigator.share)
              await navigator.share({ title: title(p), text: textShare, url });

              await navigator.clipboard.writeText(textShare);

          } catch {

              : "Primero elige al menos un producto.",

                    action: "chat",

                    prompt:
                      "Eres el asistente del Dr. Mateo Valdivia. Saluda de forma amable si es el primer mensaje. Da respuestas CORTAS (máximo 3-4 frases) sobre orientación médica general, prevención y hábitos. Nunca diagnostiques ni recetes. Si hay urgencia, indica acudir a un centro de salud. Habla en español claro.",
                  });

                  /* usa respuesta local */

              wait.remove();

            ["estudios", "experiencia"].forEach((key) => {
              const hidden = form.querySelector(`[name="${key}"]`);
              if (hidden)
                hidden.value = [
                  ...form.querySelectorAll(`[data-list-input="${key}"]`),
                ]
                  .map((input) => input.value.trim())
                  .filter(Boolean)
                  .join("\n");
            });
            const fd = new FormData(form);
            try {
              showLoader("Guardando perfil…");
              await send({
                action: "client_save",
                profile: Object.fromEntries(fd),
              });
              hideLoader();
              alert(
                "Datos guardados. Permanecerán aquí para que puedas modificarlos cuando quieras.",
              );
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app
          .querySelector("#media-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget),
              file = fd.get("file");
            try {
              showLoader("Subiendo archivo…");
              await send({
                action: "client_upload",
                kind: fd.get("kind"),
                fileData: await readDataUrl(file),
                fileName: file.name,
              });
              hideLoader();
              alert("Archivo guardado.");
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app
          .querySelector("#questions-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget);
            const mode = fd.get("mode");
            let rows = [];
            if (mode === "PRECONFIGURADA") {
              const qs = [...e.currentTarget.querySelectorAll("[data-qa-q]")];
              const as_ = [...e.currentTarget.querySelectorAll("[data-qa-a]")];
              rows = qs.map((input, i) => ({
                pregunta: input.value.trim(),
                respuesta: (as_[i]?.value || "").trim(),
              })).filter((x) => x.pregunta);
            }
            try {
              showLoader("Guardando preguntas…");
              await send({
                action: "client_save_questions",
                mode: fd.get("mode"),
                questions: rows,
                knowledge: fd.get("knowledge"),
                prompt: fd.get("prompt"),
              });
              hideLoader();
              alert("Preguntas guardadas.");
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app.querySelector("#video-add")?.addEventListener("click", () => {
          const list = app.querySelector("#video-list");
          if (!list) return;
          const n = list.querySelectorAll("[data-video-row]").length + 1;
          const wrap = document.createElement("div");
          wrap.className = "field";
          wrap.dataset.videoRow = "";
          wrap.innerHTML = `<label>Video ${n}</label><div class="grid2"><input data-video-url type="url" placeholder="https://…"><button type="button" class="action" data-remove-video>Quitar</button></div>`;
          list.appendChild(wrap);
        });
        app.querySelectorAll("[data-remove-video]").forEach((btn) =>
          btn.addEventListener("click", () => btn.closest("[data-video-row]")?.remove()),
        );
        app
          .querySelector("#youtube-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget);
            try {
              showLoader("Guardando galería…");
              await send({
                action: "client_save_youtube",
                links: [...app.querySelectorAll("[data-video-url]")]
                  .map((el) => el.value.trim())
                  .filter(Boolean),
              });
              hideLoader();
              alert("Galería guardada.");
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app
          .querySelector("#products-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget),
              products = String(fd.get("products") || "")
                .split("\n")
                .map((line) => {
                  const [descripcion, precio, stock, foto] = line.split("|");
                  return {
                    descripcion: descripcion?.trim(),
                    precio: Number(precio),
                    stock: Number(stock),
                    foto: foto?.trim(),
                  };
                });
            try {
              showLoader("Guardando carrito…");
              await send({ action: "client_save_products", products });
              hideLoader();
              alert("Carrito guardado.");
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app
          .querySelector("#extra-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget),
              file = fd.get("receipt");
            try {
              showLoader("Enviando solicitud…");
              const uploaded = await edge({
                action: "upload_receipt",
                fileData: await readDataUrl(file),
                fileName: file.name,
              });
              const result = await send({
                action: "request_extra",
                type: fd.get("type"),
                quantity: fd.get("quantity"),
                receipt: uploaded.file,
              });
              hideLoader();
              alert(
                `Solicitud enviada. Importe: S/ ${Number(result.importe).toFixed(2)}`,
              );
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app.querySelectorAll("[data-activate]").forEach((button) =>
          button.addEventListener("click", async () => {
            try {
              showLoader("Actualizando cliente…");
              await send({
                action: "admin_activate",
                codigoCliente: button.dataset.activate,
                active: button.dataset.active === "1",
              });
              state.account = await send({ action: "admin_get" });
              hideLoader();
              render();
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          }),
        );
        app.querySelectorAll("[data-extra-approve]").forEach((button) =>
          button.addEventListener("click", async () => {
            try {
              showLoader("Aprobando servicio…");
              await send({
                action: "admin_approve_extra",
                codigoCliente: button.dataset.extraApprove,
                type: button.dataset.extraType,
              });
              state.account = await send({ action: "admin_get" });
              hideLoader();
              render();
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          }),
        );
        app.querySelectorAll("[data-admin-video]").forEach((button) =>
          button.addEventListener("click", () => {
            const form = app.querySelector("#admin-video-form");
            form.classList.remove("hidden");
            form.elements.codigoCliente.value = button.dataset.adminVideo;
            form.scrollIntoView({ behavior: "smooth" });
          }),
        );
        app
          .querySelector("#admin-video-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget),
              file = fd.get("file");
            try {
              showLoader("Guardando video…");
              await send({
                action: "admin_video",
                codigoCliente: fd.get("codigoCliente"),
                fileData: await readDataUrl(file),
                fileName: file.name,
              });
              hideLoader();
              alert("Video aprobado guardado.");
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        app
          .querySelector("#plans-form")
          ?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.currentTarget),
              list = (state.account?.plans || []).map((p) => ({
                ...p,
                precio_base: Number(fd.get(`base-${p.id}`)),
                precio_ia: Number(fd.get(`ia-${p.id}`)),
                precio_carrito: Number(fd.get(`cart-${p.id}`)),
                precio_producto_adicional: Number(fd.get(`product-${p.id}`)),
              }));
            try {
              showLoader("Guardando precios…");
              await send({ action: "admin_plans", plans: list });
              hideLoader();
              alert("Precios guardados.");
            } catch (error) {
              hideLoader();
              alert(error.message);
            }
          });
        }
        bindAccountForms();
        /* Delegación global: "Otro perfil" y dots siempre responden */
      pocket.addEventListener("click", (ev) => {
        const nextBtn = ev.target.closest("[data-next]");
        if (nextBtn) {
          ev.preventDefault();
          if (!state.profiles.length) return;
          state.index = (state.index + 1) % state.profiles.length;
          state.panel = null;
          state.cart = {};
          render();
          return;
        }
        const dot = ev.target.closest("[data-profile]");
        if (dot && dot.dataset.profile != null) {
          ev.preventDefault();
          state.index = Number(dot.dataset.profile);
          state.panel = null;
          state.cart = {};
          render();
        }
      });
            }

      async function init() {
        showLoader("CARGANDO APLICACIÓN…");
        try {
          const content = await edge({ action: "public_content" });
          state.formats = content.formatos?.length
            ? content.formatos
            : FALLBACK_FORMATS;
          /* Clientes de Supabase solo si tienen nombre/negocio real.
             Si vienen vacíos (sale "WebPocket" y 01/01), usamos los 8 demos. */
          /* cv_admin solo muestra EJEMPLOS. Los perfiles reales de clientes son privados en cv_start/?perfil= */
          state.profiles = DEMOS;
          state.products = content.productos || [];
          state.questions = content.preguntas || [];
          state.links = content.enlaces || [];
          state.plans = content.planes || [];
          state.serviceOk = Boolean(content.ok);
          state.registroGratis = Boolean(content.registro_gratis);
          state.serviceIA = Boolean(content.ia);
          state.index = 0;
          render();
        } catch (error) {
          state.formats = FALLBACK_FORMATS;
          state.profiles = DEMOS;
          state.serviceOk = false;
          state.serviceIA = false;
          state.index = 0;
          setNotice(error.message, "error");
          render();
        } finally {
          setTimeout(hideLoader, 400);
        }
      }
      init();
    </script>
  </body>
</html>
