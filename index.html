<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030713" />
    <title>WebPocket · CV Start</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #f8fafc;
        background: #030611;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: radial-gradient(
          circle at 50% 0,
          #17396a 0,
          #061124 33%,
          #02040b 85%
        );
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .pocket {
        --main: #38bdf8;
        --second: #a78bfa;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: min(100%, 430px);
        height: min(92vh, 840px);
        height: min(92dvh, 840px);
        min-height: 650px;
        border: 1px solid color-mix(in srgb, var(--main) 60%, #e2e8f0);
        border-radius: 31px;
        background: #030713;
        box-shadow:
          0 24px 90px color-mix(in srgb, var(--main) 26%, transparent),
          inset 0 0 0 1px #ffffff18;
      }
      @media (max-width: 520px) {
        .stage {
          padding: 0;
          place-items: stretch;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .pocket {
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .loader-overlay {
          border-radius: 0;
        }
        .app {
          padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        }
      }
      .background {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(1.05) saturate(1.15) contrast(1.05);
        background: #050914;
      }
      .shade {
        position: absolute;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          #03071188 0%,
          #07101e18 22%,
          #06102410 48%,
          #02030bcc 100%
        );
      }
      .app {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 17px 14px 15px;
        gap: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .head.compact {
        min-height: 0;
        margin-bottom: 0;
      }
      .head.compact .brand { display: none; }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.7px;
      }
      .brand small,
      .eyebrow {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1.2px;
        color: #dbeafe;
      }
      .status {
        display: inline-block;
        margin-top: 9px;
        border: 1px solid #4ade8080;
        border-radius: 999px;
        padding: 4px 7px;
        background: #052e16a8;
        color: #bbf7d0;
        font-size: 8px;
        font-weight: 900;
      }
      .status.warn {
        border-color: #fde0477d;
        background: #3f2c0399;
        color: #fef08a;
      }
      .counter {
        border: 1px solid #fff4;
        border-radius: 999px;
        padding: 8px 10px;
        background: #06111eb8;
        font-size: 10px;
        font-weight: 900;
      }
      .menu {
        display: flex;
        gap: 6px;
        padding: 8px;
        max-width: 100%;
        overflow: auto;
        border: 1px solid #fff3;
        border-radius: 16px;
        background: #06101bd9;
        backdrop-filter: blur(16px);
        scrollbar-width: none;
      }
      .menu::-webkit-scrollbar {
        display: none;
      }
      .menu.side {
        position: absolute;
        left: 14px;
        top: 132px;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.side-right {
        position: absolute;
        right: 14px;
        top: 132px;
        left: auto;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.floating-right {
        position: absolute;
        right: 14px;
        top: 142px;
        left: auto;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.floating-left {
        position: absolute;
        left: 14px;
        top: 142px;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.bottom {
        order: 0;
        margin-top: 0;
        align-self: stretch;
      }
      .menu button {
        border: 0;
        border-radius: 9px;
        padding: 8px 9px;
        background: transparent;
        color: #f8fafc;
        font-size: 9px;
        font-weight: 900;
        white-space: nowrap;
      }
      .menu button:hover,
      .menu button.active {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second));
        color: var(--menu-sel, #ffffff) !important;
      }
      .content {
        margin-top: auto;
        padding: 8px 2px;
        color: #f8fafc;
        text-shadow: 0 2px 15px #020617;
      }
      .content.shifted {
        margin-left: 111px;
      }
      .content.shifted-right {
        margin-right: 111px;
      }

      .content h2 { color: var(--text, #f8fafc); }
      .role { color: var(--text2, var(--second, #e2e8f0)); }
      .desc { color: var(--text, #f8fafc); }
      .menu { background: var(--menu-bg, #06101bd9); }
      .menu button { color: var(--menu-no, #f8fafc); }
      .menu button.active, .menu button:hover {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second));
        color: var(--menu-sel, #ffffff) !important;
      }
      
      .overlay.chat-overlay {
        align-items: center !important;
        justify-content: center;
        padding: 10% 12px 12px !important;
        background: transparent !important;
        backdrop-filter: none !important;
      }
      .overlay.chat-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #02061755;
        backdrop-filter: blur(2.5px);
        pointer-events: none;
        border-radius: 31px;
      }
      .sheet-chat {
        display: flex;
        flex-direction: column;
        max-height: 62%;
        width: 100%;
        margin: auto;
        position: relative;
        z-index: 2;
        background: #0a122066 !important;
        border: 1px solid #ffffff33 !important;
        backdrop-filter: blur(6px);
        box-shadow: 0 16px 40px #0008;
      }
      .sheet-chat.transparent {
        background: #0a122040 !important;
        backdrop-filter: blur(5px);
      }
      .sheet-chat .sheet-head {
        background: transparent;
      }
      .chat-box {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 6px 2px 10px;
        min-height: 160px;
        max-height: 42vh;
      }
      .bubble {
        max-width: 90%;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 650;
        text-shadow: 0 1px 3px #000a;
      }
      .bubble.bot {
        align-self: flex-start;
        background: transparent;
        border: 0;
        color: #f8fafc;
        border-bottom-left-radius: 4px;
      }
      .bubble.user {
        align-self: flex-end;
        background: transparent;
        border: 0;
        color: #fff;
        border-bottom-right-radius: 4px;
        text-align: right;
      }
      .bubble.typing { opacity: 0.75; font-style: italic; }
      .chat-form {
        display: flex;
        gap: 8px;
        align-items: center;
        border-top: 1px solid #ffffff22;
        padding-top: 10px;
        background: transparent;
      }
      .chat-form input {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid #ffffff44;
        background: #0b1220aa;
        color: #fff;
        padding: 0 12px;
        font-size: 14px;
      }
      .chat-send {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second));
        color: var(--menu-sel, #fff);
      }

      .action.primary {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second)) !important;
        color: var(--menu-sel, #ffffff) !important;
      }
      .action.primary * { color: inherit !important; }

      .content h2 {
        margin: 7px 0;
        font-size: clamp(37px, 10vw, 56px);
        line-height: 0.88;
        letter-spacing: -2.8px;
        max-width: 9ch;
      }
      .role {
        margin: 0 0 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .desc {
        max-width: 32ch;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 600;
      }
      .location {
        margin: 11px 0 0;
        font-size: 11px;
        font-weight: 750;
      }
      
      .format-caption {
        margin: 12px 0 0;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1px;
        opacity: 0.82;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions.single {
        grid-template-columns: 1fr;
      }
      .action {
        min-height: 47px;
        border: 1px solid #fff4;
        border-radius: 15px;
        background: #06111eb8;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        text-decoration: none;
        display: grid;
        place-items: center;
      }
      .action.primary {
        border-color: transparent;
        color: #06111c;
        background: linear-gradient(135deg, var(--main), var(--second));
        box-shadow: 0 10px 26px color-mix(in srgb, var(--main) 40%, transparent);
      }
      .profile-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .profile-tools button {
        min-height: 42px;
        border: 1px solid #fff4;
        border-radius: 12px;
        background: #06111eb8;
        color: #fff;
        font-size: 11px;
        font-weight: 850;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dots {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .dot {
        border: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff66;
        padding: 0;
      }
      .dot.active {
        width: 20px;
        background: var(--main);
      }
      .foot-note {
        font-size: 8px;
        letter-spacing: 0.8px;
        font-weight: 850;
        opacity: 0.72;
      }
      .join {
        display: flex;
        justify-content: center;
        margin-top: 2px;
      }
      .join a {
        min-height: 48px;
        padding: 12px 28px;
        border-radius: 999px;
        text-decoration: none;
        background: linear-gradient(135deg, #fff45a, #facc15);
        color: #16130a;
        font-size: 13px;
        font-weight: 950;
        box-shadow:
          0 0 0 1px #fff8,
          inset 0 1px #fff9,
          0 0 26px #facc1580;
      }
      .overlay {
        display: none;
        position: absolute;
        z-index: 10;
        inset: 0;
        padding: 12px;
        background: linear-gradient(180deg, #01030af0, #02030df4);
        backdrop-filter: blur(11px);
      }
      .overlay.open {
        display: flex;
        align-items: flex-start;
        padding-top: 8px;
        overflow-y: auto;
      }
      .sheet {
        max-height: 92%;
        width: 100%;
        overflow: auto;
        margin-top: 0;
        align-self: flex-start;
        border: 1px solid color-mix(in srgb, var(--main) 75%, #d9f99d);
        border-radius: 23px;
        padding: 18px;
        background: linear-gradient(
          155deg,
          #060a15fa 0%,
          #040812fc 58%,
          #02040bf9 100%
        );
        color: #f8fafc;
        box-shadow: 0 24px 70px #000d;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 21px;
      }
      .sheet p {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #0a1222;
        color: #fff;
        font-size: 19px;
      }
      .card-list,
      .gallery {
        display: grid;
        gap: 10px;
      }
      .card {
        padding: 12px;
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
      }
      .card b {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .card p {
        margin: 0;
      }
      .product {
        gap: 9px;
        align-items: center;
      }
      .product img {
        object-fit: cover;
        border-radius: 12px;
        background: #0f172a;
      }
      .card-list .card.product {
        display: grid;
        grid-template-columns: 62px 1fr;
      }
      .card-list .card.product img {
        width: 62px;
        height: 62px;
      }
      .cart-carrusel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 2px 12px;
        -webkit-overflow-scrolling: touch;
      }
      .cart-carrusel .card.product {
        min-width: 82%;
        scroll-snap-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        overflow: hidden;
      }
      .cart-carrusel .card.product img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 14px 14px 0 0;
      }
      .cart-carrusel .card.product > div {
        padding: 0 12px 12px;
      }
      .cart-grilla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cart-grilla .card.product {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: center;
      }
      .cart-grilla .card.product img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
      }
      .cart-lista {
        display: grid;
        gap: 8px;
      }
      .cart-lista .card.product {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }
      .cart-lista .card.product img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
      }
      .cart-vitrina .card.product {
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #fff3);
      }
      .cart-vitrina .card.product img {
        width: 100%;
        height: 190px;
      }
      .cart-vitrina .card.product > div {
        padding: 0 14px 14px;
        text-align: center;
      }
      .cart-market {
        display: grid;
        gap: 10px;
      }
      .cart-market .card.product {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--main) 45%, #fff2);
        background: linear-gradient(
          135deg,
          #0a1020ee,
          color-mix(in srgb, var(--main) 12%, #0a1020)
        );
      }
      .cart-market .card.product img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .qty button {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid #ffffff33;
        background: linear-gradient(180deg, #1e293bcc, #0f172acc);
        color: #fff;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
      }
      .qty span {
        min-width: 24px;
        text-align: center;
        font-weight: 800;
      }
      .carta-sheet {
        position: relative;
        overflow: hidden;
        min-height: min(92dvh, 720px) !important;
        max-height: none !important;
      }
      .overlay.open:has(.carta-sheet) {
        align-items: stretch;
      }
      .carta-sheet .carta-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        filter: brightness(0.5);
      }
      .carta-sheet .carta-inner {
        position: relative;
        z-index: 1;
      }
      .carta-menu {
        white-space: pre-wrap;
        font-size: 17px;
        line-height: 1.55;
        font-weight: 700;
        color: #f8fafc;
        text-shadow: 0 2px 8px #000a;
        padding: 14px;
        border-radius: 14px;
        background: #00000066;
        border: 1px solid #ffffff22;
        margin-bottom: 12px;
      }
      .carta-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
        border-radius: 14px;
        background: #0b1220e6;
        border: 1px solid #ffffff22;
      }
      .carta-item b {
        font-size: 15px;
        font-weight: 800;
        flex: 1;
      }
      .order-box {
        margin-top: 14px;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid #25d36655;
        background: linear-gradient(160deg, #0d2818ee, #0a1f14f0);
        box-shadow: 0 8px 28px #0008;
      }
      .order-box strong {
        display: block;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .btn-wa {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(180deg, #25d366, #1ebe57);
        color: #04150a !important;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.2px;
        box-shadow: 0 10px 24px #25d36644;
        cursor: pointer;
      }
      .btn-wa:active { transform: scale(0.98); }
      .lightbox {
        position: absolute;
        inset: 0;
        z-index: 80;
        background: rgba(2, 6, 18, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        border-radius: 31px;
        cursor: zoom-out;
      }
      .lightbox img {
        max-width: 100%;
        max-height: 78%;
        border-radius: 16px;
        object-fit: contain;
        box-shadow: 0 20px 50px #000c;
        pointer-events: none;
      }
      .card.product img[data-zoom-src] {
        cursor: zoom-in;
        pointer-events: auto;
        position: relative;
        z-index: 2;
      }
      .cart-hint {
        font-size: 10px;
        opacity: 0.75;
        margin: 0 0 8px;
      }
      .gallery iframe {
        width: 100%;
        aspect-ratio: 16/9;
        border: 0;
        border-radius: 13px;
        background: #000;
      }
      .faq-item,
      .exp-item {
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
        overflow: hidden;
      }
      .faq-item button,
      .exp-item button {
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: #f8fafc;
        padding: 12px;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .faq-item > button b {
        font-size: 16px;
        font-weight: 900;
        line-height: 1.35;
        text-align: center;
        width: 100%;
        text-shadow: 0 0 12px var(--main, #38bdf8aa);
      }
      .faq-item > button, .exp-item > button {
        font-size: 16px !important;
        padding: 14px 12px !important;
        text-align: center;
        justify-content: center;
        flex-direction: column;
        gap: 4px;
      }
      .faq-item > button span, .exp-item > button span {
        position: absolute;
        right: 12px;
        top: 12px;
      }
      .faq-item, .exp-item { position: relative; }
      .faq-body {
        font-size: 15px !important;
        line-height: 1.55 !important;
        text-align: center !important;
        color: #f1f5f9 !important;
        text-shadow: 0 0 10px #38bdf866;
      }
      .exp-body {
        font-size: 15px !important;
        line-height: 1.55 !important;
        text-align: center !important;
        color: #f1f5f9 !important;
        text-shadow: 0 0 10px #38bdf866;
      }
      .sheet-chat.transparent { background: #0a1220a8 !important; backdrop-filter: blur(10px); }
      .title-styled {
        display: inline;
        padding: 0;
        border: 0 !important;
        background: transparent !important;
        border-radius: 0;
        line-height: 1.12;
        max-width: 100%;
        /* contorno de letra, no caja */
        paint-order: stroke fill;
      }
      .info-hero {

                  .filter((l) => l && !/^(entradas?|segundos?|fondos?|menu):?$/i.test(l));
                if (cur === "entradas") entradas = entradas.concat(items);
                else if (cur === "segundos") segundos = segundos.concat(items);
                else otros = otros.concat(items);
              }
              return { entradas, segundos, otros };
            }
            // sin encabezados: primera mitad entradas, resto segundos si hay muchas líneas
            const all = t
              .split("\n")
              .map((l) => l.replace(/^[-•*\d.)\s]+/, "").trim())
              .filter((l) => l);
            if (all.length <= 2) return { entradas: all, segundos: [], otros: [] };
            const mid = Math.ceil(all.length / 2);
            return { entradas: all.slice(0, mid), segundos: all.slice(mid), otros: [] };
          };

          const sec = parseSecciones(texto);
          const itemRow = (name) => {
            const qty = state.cartaCart[name] || 0;

              '<div class="carta-item"><b>' +
              esc(name) +
              '</b><div class="qty"><button type="button" data-carta-qty="-" data-id="' +

              '">−</button><span>' +
              qty +
              '</span><button type="button" data-carta-qty="+" data-id="' +
              esc(name) +
              '">+</button></div></div>'
            );
          };

          let bodyHtml = "";
          if (sec.entradas.length) {
            bodyHtml += '<p class="carta-sec-title">🍽 Entradas</p>' + sec.entradas.map(itemRow).join("");
          }
          if (sec.segundos.length) {
            bodyHtml += '<p class="carta-sec-title">🥩 Segundos</p>' + sec.segundos.map(itemRow).join("");
          }
          if (!sec.entradas.length && !sec.segundos.length) {
            if (sec.otros.length) bodyHtml = sec.otros.map(itemRow).join("");

          const fondoStyle = fondo

          return (

            (fondo ? '<div class="carta-bg" style="' + fondoStyle + '"></div>' : "") +
            '<div class="carta-inner">' +
            '<div class="sheet-head"><div><span class="eyebrow">HOY</span><h3>Carta diaria</h3></div><button class="close" data-close>×</button></div>' +
            bodyHtml +
            (msg ? '<p class="carta-msg">' + esc(msg) + "</p>" : "") +
            '<div class="order-box" style="margin-top:auto;padding-top:14px">' +
            (phoneOf(p)
              ? '<button type="button" class="btn-wa" data-wa-carta>📱 Pedir por WhatsApp</button>'
              : '<p class="message">Sin número de WhatsApp configurado.</p>') +
            "</div></div></section></aside>"
          );
        }
        if (state.panel === "products") {
          const items = products(p).map((x, i) =>
            typeof x === "string"
              ? {
                  descripcion: x,
                  precio: [12, 18, 28, 35, 9][i] || 15,
                  foto: "webpocket-pizza.jpg",
                }
              : x,
          );
          const cls = cartClass(p);
          const monSymbol = (m) => (m === "USD" ? "$" : m === "EUR" ? "€" : "S/");
          const total = Object.entries(state.cart || {}).reduce((n, [id, qty]) => {
            const prod = items.find((x) => (x.descripcion || "") === id);
            return n + qty * Number(prod?.precio || 0);
          }, 0);
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">PRODUCTOS</span><h3>${esc(title(p))}</h3></div>${close}</div><p class="cart-hint">${esc(cartHint(cls))} · Toca la foto para ampliar</p><div class="${cls}">${items
            .map((x) => {
              const id = x.descripcion || "";
              const qty = state.cart[id] || 0;
              const mon = monSymbol(x.moneda);
              const img = x.foto || x.url_foto || "";
              return `<article class="card product">
                ${img ? `<img src="${esc(img)}" alt="${esc(id)}" data-zoom-src="${esc(img)}" style="cursor:zoom-in">` : ""}
                <div>
                  <b>${esc(id)}</b>
                  <p>${mon} ${Number(x.precio || 0).toFixed(2)}${x.stock != null ? ` · Stock ${esc(x.stock)}` : ""}</p>
                  <div class="qty">
                    <button type="button" data-qty="-" data-id="${esc(id)}">−</button>
                    <span>${qty}</span>
                    <button type="button" data-qty="+" data-id="${esc(id)}">+</button>
                  </div>
                </div>
              </article>`;
            })
            .join("")}</div>
            <div class="order-box">
              <strong>Total ${total.toFixed(2)}</strong>
              ${phoneOf(p)
                ? `<button type="button" class="btn-wa" data-order>📱 Pedir por WhatsApp</button>`
                : `<p class="message">Sin WhatsApp en el perfil del negocio.</p>`}
            </div>
          </section></aside>`;
        }
        if (state.panel === "gallery")
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">GALERÍA</span><h3>Videos</h3></div>${close}</div><div class="gallery">${
            links(p).map(normalizeVideoUrl).map(videoEmbedHtml).join("") || "<p>No hay videos públicos.</p>"
          }</div></section></aside>`;
        return "";
      }
      function render() {

        let titleStyle = "";

        if (paused) {

        }${state.qr ? "" : (secondaryKeys.length ? "" : '<button type="button" class="action" data-next>Otro perfil</button>')}</div>${
          cv

            : `<div class="profile-tools">${pro ? '<button type="button" data-panel="products">Ver carrito</button>' : ""}${(p.carta_diaria_activa || styleExtra.carta_diaria) ? '<button type="button" data-panel="carta">Carta del día</button>' : ""}${p.url_carta ? '<button type="button" data-share-carta>Compartir carta</button><button type="button" data-download-carta>Bajar carta</button>' : ""}</div>`
        }${p.url_audio ? `<div class="profile-tools"><button type="button" data-toggle-audio>♪ Música</button><audio id="wp-audio" src="${esc(p.url_audio)}" loop preload="none"></audio></div>` : ""}<div class="footer">${
          state.qr
            ? ""
            : `<div class="dots">${state.profiles
                .map(
                  (_, i) =>
                    `<button type="button" class="dot ${i === state.index ? "active" : ""}" data-profile="${i}"></button>`,
                )
                .join("")}</div>`
        }<span class="foot-note"></span></div>${

      async function init() {
        showLoader(qrCode ? "CARGANDO PERFIL…" : "CARGANDO EJEMPLOS…");
        try {
          let d = { formatos: [], clientes: [], productos: [], preguntas: [], enlaces: [] };
          try {
            d = await edge({ action: "public_content" });
          } catch (e) {
            console.warn("public_content", e);
          }
          state.formats = d.formatos?.length ? d.formatos : FALLBACK;
          state.service = Boolean(d.ia);
          state.products = d.productos || [];
          state.questions = d.preguntas || [];
          state.links = d.enlaces || [];

          if (qrCode) {
            let one = null;
            try {
              one = await edge({
                action: "public_profile",
                codigo_cliente: qrCode,
                perfil: qrCode,
              });
            } catch (e) {
              console.warn("public_profile", e);
              one = null;
            }
            let profile =
              one?.profile ||
              one?.cliente ||
              one?.client ||
              (d.clientes || []).find(
                (item) => String(item.codigo_cliente) === String(qrCode),
              ) ||
              null;
            if (!profile || !profile.codigo_cliente) {
              throw Error(
                one?.error ||
                  "El perfil QR no está activo o no existe. Código: " + qrCode,
              );
            }
            const active =
              profile.activo === true ||
              profile.activo === "true" ||
              profile.activo === 1 ||
              profile.activo === "1" ||
              profile.activo === undefined;
            if (profile.activo === false || profile.activo === "false" || profile.activo === 0) {
              throw Error(
                "Este perfil aún no está activo. El administrador debe validar el pago.",
              );
            }
            const bag = {
              productos: one?.products || one?.productos || d.productos || [],
              preguntas: one?.questions || one?.preguntas || d.preguntas || [],
              enlaces: one?.links || one?.enlaces || d.enlaces || [],
              profile: one?.profile || profile,
            };
            state.products = bag.productos;
            state.questions = bag.preguntas;
            state.links = bag.enlaces;
            // fusionar campos de estilo desde profile
            profile.estilo_marco = profile.estilo_marco || one?.profile?.estilo_marco;
            profile.modalidad = profile.modalidad || one?.profile?.modalidad;
            const normalized = normalizePublicProfile(profile, bag);
            state.profiles = [normalized];
            state.index = 0;
          } else {
            state.profiles = DEMOS;
            state.index = 0;
          }
          render();
        } catch (error) {
          console.error(error);
          if (qrCode) {
            app.innerHTML =
              `<div style="padding:20px"><p class="message">${esc(error.message || "No se pudo cargar el perfil")}</p>` +
              `<div class="join" style="margin-top:16px"><a href="${REGISTRO_URL}">Registrar mi WebPocket</a></div></div>`;
          } else {
            state.formats = FALLBACK;
            state.profiles = DEMOS;
            state.service = false;
            try {
              render();
            } catch (e) {
              app.innerHTML = `<p class="message" style="padding:20px">Error al mostrar ejemplos.</p>`;
            }
          }
        } finally {
          hideLoader();
        }
      }
      // zoom global (no depende de re-render)
      if (!window.__wpZoom) {
        window.__wpZoom = true;
        document.getElementById("pocket")?.addEventListener(
          "click",
          (e) => {
            const img = e.target.closest?.("img[data-zoom-src]");
            if (!img) return;
            e.preventDefault();
            e.stopPropagation();
            const src = img.getAttribute("data-zoom-src");
            if (!src) return;
            document.querySelector("#pocket .lightbox")?.remove();
            const box = document.createElement("div");
            box.className = "lightbox";
            const im = document.createElement("img");
            im.src = src;
            box.appendChild(im);
            box.onclick = () => box.remove();
            document.getElementById("pocket").appendChild(box);
          },
          true,
        );
      }
      init();
    </script>
  </body>
</html>
