<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <title>WebPocket · La página web de bolsillo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#050914; color:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 5%, #16315b 0%, #07101e 35%, #03060d 100%); }
    button { font:inherit; cursor:pointer; }
    .page { min-height:100vh; padding:22px 16px; display:grid; place-items:center; }
    .pocket { width:min(100%, 430px); min-height:780px; height:min(92vh, 850px); position:relative; overflow:hidden; isolation:isolate; border:1px solid color-mix(in srgb, var(--main) 55%, #cbd5e1); border-radius:30px; box-shadow:0 22px 80px color-mix(in srgb, var(--main) 25%, transparent), inset 0 0 0 1px #ffffff12; background:var(--bg, #07101e); }
    .media, .media-fallback, .veil { position:absolute; inset:0; }
    .media { z-index:-3; width:100%; height:100%; object-fit:cover; background:#09111e; }
    .media-fallback { z-index:-4; background:linear-gradient(145deg, var(--main), var(--second)); opacity:.5; }
    .veil { z-index:-2; pointer-events:none; background:linear-gradient(180deg, #050914c9 0%, #07101e26 26%, #07101e20 50%, #030711eb 100%); }
    .shell { min-height:100%; display:flex; flex-direction:column; padding:19px 15px 17px; gap:14px; }
    .brand-line, .meta { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .brand h1 { font-size:17px; line-height:1; margin:0; letter-spacing:-.8px; }
    .brand small, .kicker { display:block; color:#dbeafe; opacity:.84; font-size:9px; font-weight:800; letter-spacing:1.25px; margin-top:5px; }
    .count, .health { border:1px solid #ffffff38; border-radius:999px; background:#07101eb8; backdrop-filter:blur(12px); font-size:10px; font-weight:800; padding:8px 10px; white-space:nowrap; }
    .healths { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
    .health { padding:4px 7px; color:#fecaca; border-color:#fb71857a; font-size:8px; }
    .health.ok { color:#bbf7d0; border-color:#4ade8085; background:#052e16a6; }
    .health.wait { color:#fef08a; border-color:#fde0477d; }
    .menu { display:flex; gap:6px; align-items:center; overflow:auto; scrollbar-width:none; padding:8px; border:1px solid #ffffff26; border-radius:16px; background:color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter:blur(15px); }
    .menu::-webkit-scrollbar { display:none; }
    .menu button { color:#f8fafc; border:0; border-radius:9px; background:transparent; padding:8px 9px; white-space:nowrap; font-size:10px; font-weight:800; }
    .menu button.active, .menu button:hover { background:color-mix(in srgb, var(--main) 72%, #09111e); }
    .content { margin-top:auto; padding:9px 2px; text-shadow:0 2px 15px #020617; }
    .content .kicker { color:var(--second); font-size:9px; }
    .content h2 { margin:7px 0 7px; font-size:clamp(38px, 10vw, 55px); line-height:.9; letter-spacing:-2.7px; max-width:8ch; }
    .role { margin:0 0 12px; font-size:13px; font-weight:750; }
    .description { margin:0; max-width:31ch; font-size:14px; font-weight:550; line-height:1.45; }
    .location { margin:12px 0 0; font-size:11px; font-weight:700; opacity:.9; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .action { min-height:49px; border:1px solid #ffffff3a; border-radius:15px; color:#fff; background:#07101eb3; font-size:12px; font-weight:850; backdrop-filter:blur(12px); }
    .action.primary { color:#06111f; border-color:transparent; background:linear-gradient(135deg, var(--main), var(--second)); box-shadow:0 10px 28px color-mix(in srgb, var(--main) 45%, transparent); }
    .bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:5px; }
    .dots { display:flex; gap:5px; }
    .dot { width:8px; height:8px; border-radius:999px; background:#ffffff54; border:0; padding:0; }
    .dot.active { width:20px; background:var(--main); }
    .help { color:#cbd5e1; font-size:8px; font-weight:800; letter-spacing:.8px; text-decoration:none; }
    .panel { display:none; position:absolute; z-index:4; inset:auto 11px 11px; max-height:61%; overflow:auto; padding:18px; border:1px solid color-mix(in srgb, var(--main) 55%, #e2e8f0); border-radius:22px; background:color-mix(in srgb, var(--bg) 92%, #020617); box-shadow:0 18px 40px #020617a8; backdrop-filter:blur(18px); }
    .panel.open { display:block; }
    .panel-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:13px; }
    .panel h3 { margin:0; font-size:19px; letter-spacing:-.7px; }
    .close { width:33px; height:33px; border:1px solid #ffffff2e; color:#fff; border-radius:50%; background:#ffffff12; font-size:18px; }
    .list { display:grid; gap:8px; }
    .card { padding:12px; border:1px solid #ffffff1c; border-radius:14px; background:#ffffff0c; }
    .card b { display:block; font-size:13px; margin-bottom:4px; }
    .card p { margin:0; color:#dbeafe; font-size:12px; line-height:1.45; }
    .product { display:grid; grid-template-columns:56px 1fr auto; gap:10px; align-items:center; }
    .product img, .product-placeholder { width:56px; height:56px; border-radius:12px; object-fit:cover; background:linear-gradient(135deg,var(--main),var(--second)); }
    .product button { border:1px solid var(--main); color:#06111f; border-radius:10px; padding:7px 9px; background:var(--main); font-size:11px; font-weight:800; }
    .gallery { display:grid; gap:12px; }
    .gallery iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:13px; background:#000; }
    .profile-picker { display:grid; gap:7px; }
    .profile-picker button { text-align:left; color:#fff; border:1px solid #ffffff22; border-radius:13px; background:#ffffff0b; padding:12px; font-weight:750; }
    .profile-picker button:hover { border-color:var(--main); background:#ffffff17; }
    .empty { margin:auto 0; padding:26px 18px; border:1px dashed #ffffff35; border-radius:20px; background:#07101eaa; text-align:center; }
    .empty h2 { margin:0 0 10px; font-size:24px; }
    .empty p { color:#cbd5e1; font-size:13px; line-height:1.5; }
    .notice { font-size:11px; color:#fecaca; line-height:1.4; }
    .loading { margin:auto; color:#e2e8f0; font-size:13px; font-weight:700; }
    @media (min-width:650px) { .pocket { min-height:760px; } }
  </style>
</head>
<body>
  <main class="page"><section class="pocket" id="app" aria-live="polite"><div class="loading">Conectando con WebPocket…</div></section></main>
  <script>
    /*
      CONFIGURACIÓN OBLIGATORIA ANTES DE PUBLICAR
      1. Mantén la URL REST de Supabase.
      2. Pega tu clave ANON/PUBLISHABLE en SUPABASE_ANON_KEY.
      3. No uses una service_role key ni una clave de OpenRouter en este HTML.
      Esta página solo realiza lecturas GET a Supabase.
    */
    const SUPABASE_URL = 'https://rrubzwdrsuyjntoejmew.supabase.co/rest/v1';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJydWJ6d2Ryc3V5am50b2VqbWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNDgxMzksImV4cCI6MjA4NzcyNDEzOX0.2skpmRdeb43Ck0IUAKyBcW5g3KAHPf7_st-QaAJ2K0E';
    const app = document.querySelector('#app');
    const state = { profiles: [], formats: [], products: [], questions: [], links: [], index: 0, panel: null };

    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const isConfigured = () => SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('PEGA_AQUI');
    const normalize = value => String(value || '').replace(/\/$/, '');
    const get = async (table, params) => {
      const response = await fetch(`${normalize(SUPABASE_URL)}/${table}?${params}`, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
      if (!response.ok) throw new Error(`${table}: ${response.status}`);
      return response.json();
    };
    const youtubeEmbed = url => {
      try { const id = new URL(url).searchParams.get('v') || new URL(url).pathname.split('/').filter(Boolean).pop(); return id ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}` : ''; } catch { return ''; }
    };
    const profileCode = p => p.codigo_cliente || p.id || '';
    const profileTitle = p => p.negocio || p.nombre || 'Perfil WebPocket';
    const profileRole = p => p.giro || p.tipo_perfil || p.categoria || 'Perfil activo';
    const profileDescription = p => p.perfil || p.descripcion || 'Información publicada desde WebPocket.';
    const localVideo = p => {
      const key = `${p.numero_perfil || ''} ${p.codigo_cliente || ''} ${p.nombre || ''} ${p.negocio || ''} ${p.categoria || ''}`.toLowerCase();
      if (/^1\b|alejandro|oficina/.test(key)) return 'video_cvoficina.mp4';
      if (/^2\b|marco|limpieza/.test(key)) return 'video_cvlimpieza.mp4';
      if (/^3\b|mateo|doctor|salud/.test(key)) return 'video_cvdoctor.mp4';
      if (/^4\b|carlos|construccion|construcción/.test(key)) return 'video_cvcontruccion.mp4';
      if (/^5\b|dulce|picarones/.test(key)) return 'video_negocio1.mp4';
      if (/^6\b|forno|pizza/.test(key)) return 'video_negocio2.mp4';
      if (/^7\b|torque|mecanica|mecánica/.test(key)) return 'video_negocio3.mp4';
      if (/^8\b|tinta|polos/.test(key)) return 'video_negocio4.mp4';
      return '';
    };
    const profileVideo = p => p.urlvideo_aprobado || p.urlvideo || p.video || localVideo(p);
    const profilePhoto = p => p.urlfoto || p.foto || '';
    const formatFor = p => state.formats.find(f => f.id === p.formato_id) || state.formats[0] || {};
    const colorsFor = p => { const f = formatFor(p); return { main: p.color_principal || f.color_principal || '#38bdf8', second: p.color_secundario || f.color_secundario || '#a78bfa', bg: p.color_fondo || f.color_fondo || '#07101e', text: p.color_texto || f.color_texto || '#f8fafc' }; };
    const itemsFor = (collection, profile, field='codigo_cliente') => collection.filter(item => item[field] === profileCode(profile));

    function renderPanel(profile) {
      if (!state.panel) return '';
      const close = '<button class="close" data-close aria-label="Cerrar">×</button>';
      if (state.panel === 'profiles') return `<aside class="panel open"><div class="panel-head"><h3>Perfiles</h3>${close}</div><div class="profile-picker">${state.profiles.map((p,i)=>`<button data-profile="${i}">${esc(profileTitle(p))}<small>${esc(profileRole(p))}</small></button>`).join('')}</div></aside>`;
      if (state.panel === 'questions') { const rows = itemsFor(state.questions, profile).filter(q=>q.pregunta).map(q=>`<div class="card"><b>${esc(q.pregunta)}</b><p>${esc(q.respuesta || 'Respuesta configurada próximamente.')}</p></div>`); return `<aside class="panel open"><div class="panel-head"><h3>Preguntas</h3>${close}</div><div class="list">${rows.join('') || '<p class="notice">Este perfil aún no tiene preguntas públicas configuradas.</p>'}</div></aside>`; }
      if (state.panel === 'products') { const rows = itemsFor(state.products, profile).map(p=>`<div class="card product">${p.foto?`<img src="${esc(p.foto)}" alt="">`:'<div class="product-placeholder"></div>'}<div><b>${esc(p.descripcion || 'Producto')}</b><p>S/ ${Number(p.precio || 0).toFixed(2)} · Stock: ${esc(p.stock ?? '—')}</p></div><button data-product="${esc(p.descripcion || 'Producto')}">Elegir</button></div>`); return `<aside class="panel open"><div class="panel-head"><h3>Productos</h3>${close}</div><div class="list">${rows.join('') || '<p class="notice">Este perfil aún no tiene productos públicos.</p>'}</div></aside>`; }
      if (state.panel === 'gallery') { const links = itemsFor(state.links, profile).filter(link => /youtube/i.test(`${link.tipo_enlace} ${link.url} ${link.valor_enlace}`)); const videos = links.map(l=>youtubeEmbed(l.url || l.valor_enlace)).filter(Boolean).map(src=>`<iframe src="${src}" title="Video de YouTube" allowfullscreen loading="lazy"></iframe>`); return `<aside class="panel open"><div class="panel-head"><h3>Galería</h3>${close}</div><div class="gallery">${videos.join('') || '<p class="notice">Este perfil aún no tiene videos públicos.</p>'}</div></aside>`; }
      return '';
    }

    function render() {
      const profile = state.profiles[state.index];
      if (!profile) { app.innerHTML = `<div class="shell"><div class="brand"><h1>WebPocket</h1><small>PERFILES DESDE SUPABASE</small></div><div class="empty"><h2>Sin perfiles activos</h2><p>La conexión con Supabase funciona, pero todavía no hay registros públicos con <b>activo = true</b> en la tabla <b>clientes</b> o <b>visible = true</b> en <b>perfiles_demo</b>.</p><p class="notice">${isConfigured() ? 'Revisa los estados de publicación en Supabase.' : 'Pega la clave pública de Supabase en la configuración del HTML.'}</p></div></div>`; return; }
      const c = colorsFor(profile), f = formatFor(profile), video = profileVideo(profile), photo = profilePhoto(profile), code = profileCode(profile);
      const products = itemsFor(state.products, profile).length, questions = itemsFor(state.questions, profile).length, gallery = itemsFor(state.links, profile).filter(l=>/youtube/i.test(`${l.tipo_enlace} ${l.url} ${l.valor_enlace}`)).length;
      app.style.setProperty('--main', c.main); app.style.setProperty('--second', c.second); app.style.setProperty('--bg', c.bg); app.style.setProperty('--text', c.text);
      app.innerHTML = `
        <div class="media-fallback"></div>${video?`<video class="media" autoplay muted loop playsinline poster="${esc(photo)}"><source src="${esc(video)}" type="video/mp4"></video>`:photo?`<img class="media" src="${esc(photo)}" alt="">`:''}<div class="veil"></div>
        <div class="shell">
          <header class="brand-line"><div class="brand"><h1>WebPocket</h1><small>${esc(f.nombre || 'FORMATO DESDE SUPABASE')}</small><div class="healths"><span class="health ok">BD CONECTADA</span><span class="health ok">FORMATOS ${state.formats.length}</span></div></div><span class="count">${String(state.index+1).padStart(2,'0')}/${String(state.profiles.length).padStart(2,'0')}</span></header>
          <nav class="menu" aria-label="Menú del perfil"><button data-panel="profile" class="active">PERFIL</button>${questions?'<button data-panel="questions">PREGUNTAS</button>':''}${products?'<button data-panel="products">PRODUCTOS</button>':''}${gallery?'<button data-panel="gallery">GALERÍA</button>':''}<button data-panel="profiles">OTROS</button></nav>
          <section class="content"><span class="kicker">${esc(profileRole(profile))} · PERFIL ACTIVO</span><h2>${esc(profileTitle(profile))}</h2><p class="role">${esc(profile.tipo_perfil || profile.categoria || 'WebPocket')}</p><p class="description">${esc(profileDescription(profile))}</p>${profile.direccion?`<p class="location">⌖ ${esc(profile.direccion)}</p>`:''}</section>
          <div class="actions"><button class="action primary" data-panel="${products?'products':questions?'questions':'profiles'}">${products?'Ver productos':questions?'Pregúntame':'Ver perfil'}</button><button class="action" data-next>Otro perfil</button></div>
          <footer class="bottom"><div class="dots">${state.profiles.map((_,i)=>`<button class="dot ${i===state.index?'active':''}" data-profile="${i}" aria-label="Abrir perfil ${i+1}"></button>`).join('')}</div><a class="help" href="#" data-panel="profiles">${esc(code || 'WEBPOCKET')}</a></footer>
        </div>${renderPanel(profile)}`;
      app.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click', event=>{event.preventDefault(); const target=el.dataset.panel; state.panel=target==='profile'?null:target; render();}));
      app.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>{state.panel=null;render()}));
      app.querySelectorAll('[data-profile]').forEach(el=>el.addEventListener('click',()=>{state.index=Number(el.dataset.profile);state.panel=null;render()}));
      app.querySelector('[data-next]')?.addEventListener('click',()=>{state.index=(state.index+1)%state.profiles.length;state.panel=null;render()});
      app.querySelectorAll('[data-product]').forEach(el=>el.addEventListener('click',()=>alert(`Producto seleccionado: ${el.dataset.product}. Configura el enlace de WhatsApp en enlaces_perfil para finalizar el pedido.`)));
    }

    async function start() {
      if (!isConfigured()) { app.innerHTML='<div class="shell"><div class="brand"><h1>WebPocket</h1><small>CONFIGURACIÓN NECESARIA</small></div><div class="empty"><h2>Falta la clave pública</h2><p>Abre este mismo archivo y reemplaza <b>PEGA_AQUI_TU_CLAVE_ANON_O_PUBLISHABLE</b> por tu clave pública de Supabase. La URL ya está configurada.</p><p class="notice">No uses una clave service_role ni una clave de OpenRouter en GitHub.</p></div></div>'; return; }
      try {
        const [formats, clients, demos, products, questions, links] = await Promise.all([
          get('formatos','select=id,nombre,descripcion,tipo_menu,posicion_navegacion,estilo_botones,color_principal,color_secundario,color_fondo,color_texto,disponible&disponible=eq.true&order=nombre.asc'),
          get('clientes','select=id,codigo_cliente,nombre,negocio,direccion,giro,perfil,tipo_perfil,urlfoto,urlvideo,urlvideo_aprobado,formato_id,color_principal,color_secundario,color_fondo,color_texto,activo&activo=eq.true&order=created_at.desc'),
          get('perfiles_demo','select=id,numero_perfil,nombre,categoria,descripcion,tipo_perfil,video,foto,formato_id,color_principal,color_secundario,color_fondo,visible&visible=eq.true&order=numero_perfil.asc').catch(()=>[]),
          get('productos','select=codigo_cliente,descripcion,precio,stock,foto,orden,activo&activo=eq.true&order=orden.asc').catch(()=>[]),
          get('inteligencia','select=codigo_cliente,pregunta,respuesta,activo,orden&activo=eq.true&order=orden.asc').catch(()=>[]),
          get('enlaces_perfil','select=codigo_cliente,tipo_enlace,titulo,valor_enlace,url,orden,visible&visible=eq.true&order=orden.asc').catch(()=>[])
        ]);
        state.formats=formats; state.profiles=[...clients,...demos]; state.products=products; state.questions=questions; state.links=links; render();
      } catch(error) { app.innerHTML=`<div class="shell"><div class="brand"><h1>WebPocket</h1><small>ERROR DE CONEXIÓN</small></div><div class="empty"><h2>No se pudo leer Supabase</h2><p>${esc(error.message)}</p><p class="notice">Comprueba que la clave pública sea correcta y que las tablas permitan lectura desde el navegador.</p></div></div>`; }
    }
    start();
  </script>
</body>
</html>
