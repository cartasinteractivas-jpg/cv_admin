<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050914" />
    <title>WebPocket · La página web de bolsillo</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #030611;
        color: #f8fafc;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: radial-gradient(
          circle at 50% 0,
          #17396a 0,
          #061124 33%,
          #02040b 85%
        );
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .pocket {
        --main: #38bdf8;
        --second: #a78bfa;
        --bg: #07101e;
        --text: #f8fafc;
        isolation: isolate;
        overflow: hidden;
        position: relative;
        width: min(100%, 430px);
        height: min(92vh, 840px);
        height: min(92dvh, 840px);
        min-height: 680px;
        border: 1px solid color-mix(in srgb, var(--main) 60%, #cbd5e1);
        border-radius: 31px;
        background: var(--bg);
        box-shadow:
          0 24px 90px color-mix(in srgb, var(--main) 30%, transparent),
          inset 0 0 0 1px #fff1;
      }
      /* Móvil: ocupa toda la pantalla (no se ve encogido) */
      @media (max-width: 520px) {
        .stage {
          padding: 0;
          place-items: stretch;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .pocket {
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .loader-overlay {
          border-radius: 0;
        }
        .app {
          padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        }
      }
      @media (max-width: 520px) and (max-height: 700px) {
        .content h2 {
          font-size: clamp(28px, 9vw, 42px);
        }
        .desc {
          font-size: 12px;
        }
        .format-caption {
          display: none;
        }
        .action {
          min-height: 44px;
        }
      }

      /* Acordeón igual que cv_start */
      .faq-item,
      .exp-item {
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
        overflow: hidden;
      }
      .faq-item > button,
      .exp-item > button {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border: 0;
        background: transparent;
        color: #f8fafc;
        padding: 12px 14px;
        text-align: left;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }
      .faq-item > button span,
      .exp-item > button span {
        font-size: 18px;
        line-height: 1;
        opacity: 0.85;
        flex-shrink: 0;
      }
      .faq-body,
      .exp-body {
        display: none !important;
        padding: 0 14px 12px;
        font-size: var(--sec-body-size, 22px);
        line-height: 1.45;
        color: var(--sec-color, #dbeafe);
        font-weight: 650;
      }
      .faq-item button b,
      .exp-item button b {
        font-size: var(--sec-body-size, 20px);
        text-shadow: 0 0 14px var(--sec-glow, #38bdf8);
      }
      .faq-item.open > .faq-body,
      .exp-item.open > .exp-body {
        display: block !important;
      }
      #bg-video.background,
      .background {
        position: absolute;
        inset: 0;
        z-index: -4;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: linear-gradient(145deg, var(--main), var(--bg));
        /* Videos nítidos y vivos: sin filtro oscuro agresivo */
        filter: brightness(1.05) saturate(1.15) contrast(1.05);
      }
      .shade {
        position: absolute;
        inset: 0;
        z-index: -3;
        pointer-events: none;
        /* Gradiente suave solo para legibilidad del texto, sin oscurecer el video */
        background: linear-gradient(
          180deg,
          #03071188 0%,
          #07101e18 22%,
          #06102410 48%,
          #02030bcc 100%
        );
      }
      .app {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 17px 14px 15px;
        gap: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.7px;
      }
      .brand small,
      .eyebrow {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 850;
        letter-spacing: 1.2px;
        color: #dbeafe;
      }
      .status-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .status {
        border: 1px solid #fde0477d;
        border-radius: 999px;
        padding: 4px 7px;
        background: #3f2c0399;
        color: #fef08a;
        font-size: 8px;
        font-weight: 850;
      }
      .status.ok {
        border-color: #4ade8080;
        background: #052e16a8;
        color: #bbf7d0;
      }
      .counter {
        border: 1px solid #fff4;
        border-radius: 999px;
        padding: 8px 10px;
        background: #06111eb8;
        backdrop-filter: blur(12px);
        font-size: 10px;
        font-weight: 900;
      }
      .menu {
        display: flex;
        gap: 6px;
        padding: 8px;
        max-width: 100%;
        overflow: auto;
        scroll-behavior: smooth;
        border: 1px solid #fff3;
        border-radius: 16px;
        background: color-mix(in srgb, var(--bg) 64%, transparent);
        backdrop-filter: blur(16px);
        scrollbar-width: none;
      }
      .menu::-webkit-scrollbar {
        display: none;
      }
      .menu.side {
        position: absolute;
        left: 14px;
        top: 132px;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.side-right {
        position: absolute;
        right: 14px;
        top: 132px;
        left: auto;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.floating-right {
        position: absolute;
        right: 14px;
        top: 142px;
        left: auto;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.floating-left {
        position: absolute;
        left: 14px;
        top: 142px;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.bottom {
        order: 4;
        margin-top: auto;
      }
      .menu.centered {
        align-self: center;
        max-width: 280px;
      }
      .menu button {
        border: 0;
        border-radius: 9px;
        padding: 8px 9px;
        background: transparent;
        color: var(--text);
        font-size: 9px;
        font-weight: 850;
        white-space: nowrap;
      }
      .menu button:hover,
      .menu button.active {
        background: color-mix(in srgb, var(--main) 76%, #06111e);
      }
      .content {
        margin-top: auto;
        padding: 8px 2px;
        color: var(--text);
        text-shadow: 0 2px 15px #020617;
      }
      .content.shifted {
        margin-left: 111px;
      }
      .content.shifted-right {
        margin-right: 111px;
      }
      .eyebrow {
        color: var(--second);
      }
      .content h2 {
        color: var(--text, #f8fafc);
        margin: 7px 0;
        font-size: clamp(37px, 10vw, 56px);
        line-height: 0.88;
        letter-spacing: -2.8px;
        max-width: 9ch;
      }
      .role {
        color: var(--text2, #e2e8f0);
        margin: 0 0 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .desc {
        max-width: 32ch;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 580;
      }
      .location {
        margin: 11px 0 0;
        font-size: 11px;
        font-weight: 750;
      }
      .format-caption {
        margin: 12px 0 0;
        font-size: 8px;
        font-weight: 850;
        letter-spacing: 1px;
        opacity: 0.75;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .action {
        min-height: 47px;
        border: 1px solid #fff4;
        border-radius: 15px;
        background: #06111eb8;
        color: #fff;
        font-size: 12px;
        font-weight: 850;
        backdrop-filter: blur(14px);
      }
      .profile-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .profile-tools button {
        min-height: 42px;
        border: 1px solid #fff4;
        border-radius: 12px;
        background: #06111eb8;
        color: #fff;
        font-size: 11px;
        font-weight: 850;
        backdrop-filter: blur(14px);
      }
      .action.primary {
        border-color: transparent;
        color: #08101b;
        background: linear-gradient(135deg, var(--main), var(--second));
        box-shadow: 0 10px 26px color-mix(in srgb, var(--main) 40%, transparent);
      }
      .always-actions {
        display: flex;
        gap: 7px;
        justify-content: flex-end;
      }
      .always-actions button {
        border: 0;
        border-radius: 999px;
        padding: 9px 13px;
        font-size: 10px;
        font-weight: 900;
      }
      .register {
        background: #fde047;
        color: #1e1b0b;
      }
      .login {
        background: #4ade80;
        color: #052e16;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dots {
        display: flex;
        gap: 5px;
      }
      .dot {
        border: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff66;
        padding: 0;
      }
      .dot.active {
        width: 20px;
        background: var(--main);
      }
      .foot-note {
        font-size: 8px;
        letter-spacing: 0.8px;
        font-weight: 850;
        opacity: 0.7;
      }
      .overlay {
        display: none;
        position: absolute;
        z-index: 10;
        inset: 0;
        padding: 12px;
        background: #01050ba8;
        backdrop-filter: blur(5px);
      }
      .overlay.open {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 6px;
        padding-bottom: 12px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .overlay.open > .sheet {
        margin-top: 0;
        align-self: flex-start;
      }
      .overlay.open.sheet-bottom {
        align-items: flex-end;
        padding-top: 12px;
      }
      .sheet {
        max-height: min(92%, calc(100% - 12px));
        width: 100%;
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #e2e8f0);
        border-radius: 23px;
        padding: 18px;
        background: color-mix(in srgb, var(--bg) 92%, #020617);
        box-shadow: 0 18px 50px #0009;
        margin-bottom: 8px;
      }
      /* Login / registro: arriba y centrado (teclado móvil no tapa) */
      
      /* Login / acceso: cajas y letras más grandes */
      .sheet.sheet-access .field label {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .sheet.sheet-access .field input,
      .sheet.sheet-access .field select,
      .sheet.sheet-access .pass-wrap input {
        min-height: 52px;
        font-size: 17px !important;
        font-weight: 700;
        padding: 12px 14px;
        border-radius: 14px;
      }
      .sheet.sheet-access .submit {
        min-height: 52px;
        font-size: 17px;
        font-weight: 900;
        border-radius: 14px;
      }
      .sheet.sheet-access .sheet-head h3 {
        font-size: 24px;
      }
      .sheet.sheet-access > p,
      .sheet.sheet-access .message {
        font-size: 14px;
        line-height: 1.45;
      }
      .sheet.sheet-access .pass-toggle {
        font-size: 13px;
        font-weight: 800;
        padding: 8px 10px;
      }

      .sheet.sheet-access {
        max-height: none;
        margin-top: 4px;
      }
      
      .admin-table th, .admin-table td { color: #e2e8f0; }
      .admin-client-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 36vh;
        overflow: auto;
        padding: 2px;
      }
      .admin-client-row {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        gap: 2px 10px;
        text-align: left;
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #ffffff22;
        background: #0b1220e8;
        color: #f8fafc;
        cursor: pointer;
      }
      .admin-client-row.active {
        border-color: var(--main, #38bdf8);
        box-shadow: 0 0 0 1px var(--main, #38bdf8);
        background: #122033;
      }
      .acr-name { font-weight: 900; font-size: 14px; grid-column: 1; }
      .acr-meta { font-size: 11px; opacity: 0.8; grid-column: 1; }
      .acr-code { font-size: 10px; opacity: 0.55; grid-column: 2; grid-row: 1 / span 2; align-self: center; }
      .admin-detail .admin-switch { margin: 8px 0; }
      .admin-table tr:hover { background: #ffffff0a; }
      .app-modal {
        position: absolute;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: #01050bcc;
        backdrop-filter: blur(6px);
      }
      .app-modal.hidden { display: none; }
      .app-modal-card {
        width: 100%;
        max-width: 320px;
        border-radius: 18px;
        border: 1px solid #fff3;
        background: #0b1220;
        padding: 18px 16px;
        box-shadow: 0 20px 50px #000a;
        text-align: center;
      }
      .app-modal-card p {
        margin: 0 0 14px;
        font-size: 14px;
        line-height: 1.45;
        color: #e2e8f0;
        font-weight: 650;
      }
      .app-modal-card .submit { width: 100%; }
      
      .format-home-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .format-home-btn {
        border-radius: 16px;
        border: 1px solid #ffffff22;
        background: linear-gradient(180deg, #1e293b, #0f172a);
        color: #f8fafc;
        font-weight: 800;
        font-size: 14px;
        padding: 18px 12px;
        cursor: pointer;
        min-height: 64px;
      }
      .format-home-btn:active { transform: scale(0.98); }
      .fab-scroll-top {
        position: absolute;
        right: 14px;
        bottom: 18px;
        z-index: 50;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid #ffffff44;
        background: linear-gradient(180deg, #2563eb, #1d4ed8);
        color: #fff;
        font-size: 20px;
        font-weight: 900;
        box-shadow: 0 8px 24px #0008;
        cursor: pointer;
        display: none;
      }
      .sheet.sheet-account .fab-scroll-top.show { display: flex; align-items: center; justify-content: center; }
      .overlay.open {
        align-items: stretch;
      }
      .overlay.open .sheet.sheet-account {
        width: 100%;
        max-width: 100%;
        height: 100%;
        max-height: 100%;
        margin: 0;
        border-radius: 0;
      }

      .format-preview-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .format-preview {
        border: 1px solid #fff3;
        border-radius: 14px;
        padding: 8px;
        background: #0b1220;
        cursor: pointer;
      }
      .format-preview.selected {
        border-color: var(--main, #38bdf8);
        box-shadow: 0 0 0 1px var(--main, #38bdf8);
      }
      .format-preview .mini {
        height: 72px;
        border-radius: 10px;
        background: #020617;
        position: relative;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .format-preview .mini .bar {
        position: absolute;
        background: #38bdf8;
        border-radius: 4px;
      }
      .format-preview .mini.top .bar { top: 4px; left: 6px; right: 6px; height: 8px; }
      .format-preview .mini.bottom .bar { bottom: 4px; left: 6px; right: 6px; height: 8px; }
      .format-preview .mini.left .bar { top: 6px; left: 4px; bottom: 6px; width: 12px; }
      .format-preview .mini.right .bar { top: 6px; right: 4px; bottom: 6px; width: 12px; }
      .format-preview .mini.float .bar { top: 10px; right: 6px; width: 14px; height: 40px; }
      .format-preview small { font-size: 10px; color: #94a3b8; }

      .sheet.sheet-account #account-body {
        flex: 1;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 20px;
      }
      .admin-switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #fff3;
        background: #0b1220;
        margin-bottom: 12px;
      }
      .admin-switch b { display: block; font-size: 13px; }
      .admin-switch small { color: #94a3b8; font-size: 11px; }
      .switch {
        position: relative;
        width: 48px;
        height: 28px;
        flex-shrink: 0;
      }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch span {
        position: absolute;
        inset: 0;
        background: #334155;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.2s;
      }
      .switch span:before {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      .switch input:checked + span { background: #22c55e; }
      .switch input:checked + span:before { transform: translateX(20px); }

      .sheet.sheet-access .field input:focus {
        scroll-margin-top: 24px;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.8px;
      }
      .sheet p {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #fff1;
        color: #fff;
        font-size: 19px;
      }
      .card-list {
        display: grid;
        gap: 9px;
      }
      .card {
        padding: 12px;
        border: 1px solid #fff2;
        border-radius: 14px;
        background: #fff1;
      }
      .card b {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .card p {
        margin: 0;
        font-size: 12px;
      }


      /* Variantes de carrito MUY distintas */
      .cart-carrusel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 2px 12px;
        -webkit-overflow-scrolling: touch;
      }
      .cart-carrusel .card.product {
        min-width: 82%;
        scroll-snap-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        overflow: hidden;
      }
      .cart-carrusel .card.product img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 14px 14px 0 0;
      }
      .cart-carrusel .card.product > div {
        padding: 0 12px 12px;
      }
      .cart-grilla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cart-grilla .card.product {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: center;
      }
      .cart-grilla .card.product img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
      }
      .cart-grilla .qty {
        justify-content: center;
      }
      .cart-lista {
        display: grid;
        gap: 8px;
      }
      .cart-lista .card.product {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }
      .cart-lista .card.product img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        object-fit: cover;
      }
      .cart-lista .qty {
        flex-direction: column;
        margin-top: 0;
      }
      .cart-vitrina {
        display: grid;
        gap: 12px;
      }
      .cart-vitrina .card.product {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #fff3);
        box-shadow: 0 0 24px color-mix(in srgb, var(--main) 25%, transparent);
      }
      .cart-vitrina .card.product img {
        width: 100%;
        height: 190px;
        object-fit: cover;
      }
      .cart-vitrina .card.product > div {
        padding: 0 14px 14px;
        text-align: center;
      }
