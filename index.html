<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <title>WebPocket · Admin Panel</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #030611;
        color: #f8fafc;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #030611; font-size: 13px; }
      .container { max-width: 1100px; margin: 0 auto; }
      h1, h2, h3 { color: #f8fafc; margin-top: 0; }
      .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
      .admin-tabs button {
        background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 8px 16px;
        border-radius: 8px; cursor: pointer; font-weight: 700;
      }
      .admin-tabs button.active { background: #38bdf8; color: #020617; border-color: #38bdf8; }
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      
      /* Tabla estilo Excel */
      .excel-table-wrap { overflow-x: auto; background: #090d16; border: 1px solid #1e293b; border-radius: 10px; }
      table.excel-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
      table.excel-table th { background: #0f172a; color: #38bdf8; padding: 10px; border-bottom: 1px solid #1e293b; white-space: nowrap; }
      table.excel-table td { padding: 8px 10px; border-bottom: 1px solid #161e2e; color: #cbd5e1; white-space: nowrap; }
      table.excel-table tr:hover { background: #0d1527; }
      
      .btn { padding: 4px 8px; border-radius: 4px; border: none; font-size: 11px; font-weight: bold; cursor: pointer; }
      .btn-success { background: #22c55e; color: #052e16; }
      .btn-danger { background: #ef4444; color: #450a0a; }
      .btn-warning { background: #eab308; color: #422006; }
      .btn-info { background: #38bdf8; color: #082f49; }
      
      .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
      .form-group label { font-size: 11px; font-weight:bold; color: #94a3b8; }
      .form-group input, .form-group select { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #090d16; color: #fff; }
      .card { background: #090d16; border: 1px solid #1e293b; padding: 16px; border-radius: 10px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>WebPocket — Panel de Administración</h1>
      <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('clientes')">Clientes (Excel)</button>
        <button class="tab-btn" onclick="switchTab('precios')">Precios y Tarifas</button>
        <button class="tab-btn" onclick="switchTab('peticiones')">Peticiones y Adicionales</button>
      </div>

      <!-- TAB CLIENTES TIPO EXCEL -->
      <div id="tab-clientes" class="tab-content active">
        <h2>Listado General de Clientes</h2>
        <div class="excel-table-wrap">
          <table class="excel-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Usuario</th>
                <th>Tipo</th>
                <th>Estado Servicio</th>
                <th>Estado Panel</th>
                <th>Adicionales</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="clients-tbody">
              <!-- Se puebla dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- TAB PRECIOS Y TARIFAS -->
      <div id="tab-precios" class="tab-content">
        <h2>Ajuste de Precios de Planes y Carrito</h2>
        <div class="card" style="max-width: 400px;">
          <form id="prices-form">
            <div class="form-group">
              <label>Precio Plan CV (S/)</label>
              <input type="number" id="price-cv" value="40" min="0" step="0.5">
            </div>
            <div class="form-group">
              <label>Precio Plan Negocio (S/)</label>
              <input type="number" id="price-negocio" value="60" min="0" step="0.5">
            </div>
            <div class="form-group">
              <label>Precio Adicional Carrito (S/)</label>
              <input type="number" id="price-carrito" value="10" min="0" step="0.5">
            </div>
            <button type="button" class="btn btn-success" style="width:100%; padding:10px;" onclick="guardarPrecios()">Guardar Precios</button>
          </form>
        </div>
      </div>

      <!-- TAB PETICIONES Y ADICIONALES -->
      <div id="tab-peticiones" class="tab-content">
        <h2>Solicitudes de Adicionales</h2>
        <div id="peticiones-list" class="card">
          <p>Selecciona un cliente desde la vista de Excel para inspeccionar sus peticiones específicas.</p>
        </div>
      </div>
    </div>

    <script>
      const EDGE_URL = "https://rrubzwdrsuyjntoejmew.supabase.co/functions/v1/webpocket-api";

      function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.target.classList.add('active');
      }

      async function cargarClientes() {
        try {
          const res = await fetch(EDGE_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action: 'admin_list_clients' })
          });
          const data = await res.json();
          renderTablaExcel(data.clients || []);
        } catch (e) {
          console.error("Error al cargar lista de clientes:", e);
        }
      }

      function renderTablaExcel(clientes) {
        const tbody = document.getElementById('clients-tbody');
        tbody.innerHTML = clientes.map(c => `
          <tr>
            <td><b>${c.codigo_cliente}</b></td>
            <td>${c.usuario}</td>
            <td><span class="btn btn-info">${c.tipo_perfil}</span></td>
            <td>${c.servicio_activo ? '<span class="btn btn-success">Activo</span>' : '<span class="btn btn-danger">Inactivo</span>'}</td>
            <td>${c.panel_activo ? '<span class="btn btn-success">Habilitado</span>' : '<span class="btn btn-warning">Bloqueado</span>'}</td>
            <td>${c.tiene_carrito ? 'Carrito (+S/10)' : 'Estándar'}</td>
            <td>
              <button class="btn btn-warning" onclick="toggleServicio('${c.codigo_cliente}', ${!c.servicio_activo})">
                ${c.servicio_activo ? 'Desactivar Servicio' : 'Activar Servicio'}
              </button>
              <button class="btn btn-danger" onclick="togglePanel('${c.codigo_cliente}', ${!c.panel_activo})">
                ${c.panel_activo ? 'Desactivar Panel' : 'Activar Panel'}
              </button>
              <button class="btn btn-info" onclick="verPeticiones('${c.codigo_cliente}')">Ver Peticiones</button>
            </td>
          </tr>
        `).join('');
      }

      async function toggleServicio(codigo, nuevoEstado) {
        await fetch(EDGE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_toggle_service', codigo_cliente: codigo, estado: nuevoEstado })
        });
        cargarClientes();
      }

      async function togglePanel(codigo, nuevoEstado) {
        await fetch(EDGE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_toggle_panel', codigo_cliente: codigo, estado: nuevoEstado })
        });
        cargarClientes();
      }

      async function guardarPrecios() {
        const cv = document.getElementById('price-cv').value;
        const negocio = document.getElementById('price-negocio').value;
        const carrito = document.getElementById('price-carrito').value;

        await fetch(EDGE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ action: 'admin_update_prices', precio_cv: cv, precio_negocio: negocio, precio_carrito: carrito })
        });
        alert("Precios actualizados con éxito.");
      }

      function verPeticiones(codigo) {
        switchTab('peticiones');
        document.getElementById('peticiones-list').innerHTML = `
          <h3>Peticiones para cliente: ${codigo}</h3>
          <p><b>Adicionales solicitados:</b> Modificación de diseño, ampliación de catálogo.</p>
          <button class="btn btn-success" onclick="alert('Petición procesada')">Marcar Atendido</button>
        `;
      }

      // Validar tamaño de video antes de subir (< 15 MB)
      function validarTamanoVideo(fileInput) {
        const file = fileInput.files[0];
        if (file && file.size > 15 * 1024 * 1024) {
          alert("El video excede el límite permitido de 15 MB. Por favor comprímelo antes de subirlo.");
          fileInput.value = "";
          return false;
        }
        return true;
      }

      window.onload = cargarClientes;
    </script>
  </body>
</html>
