  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030611;color:#f8fafc;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17396a 0,#061124 33%,#02040b 85%)}button,input,select,textarea{font:inherit}button{cursor:pointer}.stage{min-height:100vh;display:grid;place-items:center;padding:18px}.pocket{--main:#38bdf8;--second:#a78bfa;--bg:#07101e;--text:#f8fafc;isolation:isolate;overflow:hidden;position:relative;width:min(100%,430px);height:min(92vh,840px);min-height:680px;border:1px solid color-mix(in srgb,var(--main) 60%,#cbd5e1);border-radius:31px;background:var(--bg);box-shadow:0 24px 90px color-mix(in srgb,var(--main) 30%,transparent),inset 0 0 0 1px #fff1}.background{position:absolute;inset:0;z-index:-4;width:100%;height:100%;object-fit:cover;background:linear-gradient(145deg,var(--main),var(--bg))}.shade{position:absolute;inset:0;z-index:-3;pointer-events:none;background:linear-gradient(180deg,#030711cf 0%,#07101e26 28%,#0610241d 54%,#02030be8 100%)}.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:17px 14px 15px;gap:12px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand h1{margin:0;font-size:17px;letter-spacing:-.7px}.brand small,.eyebrow{display:block;margin-top:4px;font-size:8px;font-weight:850;letter-spacing:1.2px;color:#dbeafe}.status-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.status{border:1px solid #fde0477d;border-radius:999px;padding:4px 7px;background:#3f2c0399;color:#fef08a;font-size:8px;font-weight:850}.status.ok{border-color:#4ade8080;background:#052e16a8;color:#bbf7d0}.counter{border:1px solid #fff4;border-radius:999px;padding:8px 10px;background:#06111eb8;backdrop-filter:blur(12px);font-size:10px;font-weight:900}.menu{display:flex;gap:6px;padding:8px;max-width:100%;overflow:auto;scroll-behavior:smooth;border:1px solid #fff3;border-radius:16px;background:color-mix(in srgb,var(--bg) 64%,transparent);backdrop-filter:blur(16px);scrollbar-width:none}.menu::-webkit-scrollbar{display:none}.menu.side{position:absolute;left:14px;top:132px;flex-direction:column;width:104px;z-index:3}.menu.side-right{position:absolute;right:14px;top:132px;left:auto;flex-direction:column;width:104px;z-index:3}.menu.floating-right{position:absolute;right:14px;top:142px;left:auto;max-width:118px;flex-direction:column;z-index:3}.menu.floating-left{position:absolute;left:14px;top:142px;max-width:118px;flex-direction:column;z-index:3}.menu.bottom{order:4;margin-top:auto}.menu.centered{align-self:center;max-width:280px}.menu button{border:0;border-radius:9px;padding:8px 9px;background:transparent;color:var(--text);font-size:9px;font-weight:850;white-space:nowrap}.menu button:hover,.menu button.active{background:color-mix(in srgb,var(--main) 76%,#06111e)}.content{margin-top:auto;padding:8px 2px;color:var(--text);text-shadow:0 2px 15px #020617}.content.shifted{margin-left:111px}.content.shifted-right{margin-right:111px}.eyebrow{color:var(--second)}.content h2{margin:7px 0;font-size:clamp(37px,10vw,56px);line-height:.88;letter-spacing:-2.8px;max-width:9ch}.role{margin:0 0 11px;font-size:13px;font-weight:800}.desc{max-width:32ch;margin:0;font-size:13px;line-height:1.45;font-weight:580}.location{margin:11px 0 0;font-size:11px;font-weight:750}.format-caption{margin:12px 0 0;font-size:8px;font-weight:850;letter-spacing:1px;opacity:.75}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:47px;border:1px solid #fff4;border-radius:15px;background:#06111eb8;color:#fff;font-size:12px;font-weight:850;backdrop-filter:blur(14px)}.action.primary{border-color:transparent;color:#08101b;background:linear-gradient(135deg,var(--main),var(--second));box-shadow:0 10px 26px color-mix(in srgb,var(--main) 40%,transparent)}.always-actions{display:flex;gap:7px;justify-content:flex-end}.always-actions button{border:0;border-radius:999px;padding:9px 13px;font-size:10px;font-weight:900}.register{background:#fde047;color:#1e1b0b}.login{background:#4ade80;color:#052e16}.footer{display:flex;justify-content:space-between;gap:8px;align-items:center}.dots{display:flex;gap:5px}.dot{border:0;width:8px;height:8px;border-radius:999px;background:#ffffff66;padding:0}.dot.active{width:20px;background:var(--main)}.foot-note{font-size:8px;letter-spacing:.8px;font-weight:850;opacity:.7}.overlay{display:none;position:absolute;z-index:10;inset:0;padding:12px;background:#01050ba8;backdrop-filter:blur(5px)}.overlay.open{display:flex;align-items:flex-end}.sheet{max-height:92%;width:100%;overflow:auto;border:1px solid color-mix(in srgb,var(--main) 55%,#e2e8f0);border-radius:23px;padding:18px;background:color-mix(in srgb,var(--bg) 92%,#020617);box-shadow:0 18px 50px #0009}.sheet-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:14px}.sheet h3{margin:0;font-size:21px;letter-spacing:-.8px}.sheet p{font-size:12px;line-height:1.45;color:#dbeafe}.close{width:34px;height:34px;border:1px solid #fff4;border-radius:50%;background:#fff1;color:#fff;font-size:19px}.card-list{display:grid;gap:9px}.card{padding:12px;border:1px solid #fff2;border-radius:14px;background:#fff1}.card b{display:block;margin-bottom:4px;font-size:13px}.card p{margin:0;font-size:12px}.product{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:center}.product img{width:62px;height:62px;object-fit:cover;border-radius:12px;background:#0f172a}.qty{display:flex;align-items:center;gap:6px;margin-top:7px}.qty button{width:25px;height:25px;border:1px solid #fff4;border-radius:50%;background:#ffffff12;color:#fff;font-weight:900}.gallery{display:grid;gap:12px}.gallery iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:13px;background:#000}.form{display:grid;gap:11px}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:850;letter-spacing:.4px;color:#dbeafe}.field input,.field select,.field textarea{width:100%;border:1px solid #fff3;border-radius:12px;padding:11px;background:#050a14d9;color:#fff;outline:none}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 20%,transparent)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.colors input{height:42px;padding:4px}.price-box{padding:13px;border:1px solid #a3e63575;border-radius:15px;background:#19321a88}.price-box strong{display:block;color:#bef264;font-size:22px}.submit{border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,#fde047,#facc15);color:#1c1917;font-weight:950}.message{margin:0;padding:10px;border:1px solid #fff2;border-radius:12px;background:#fff1;color:#e2e8f0;font-size:12px}.message.error{border-color:#fb718580;color:#fecaca;background:#450a0a80}.message.ok{border-color:#4ade8080;color:#bbf7d0;background:#052e1680}.chat-log{display:grid;gap:8px;max-height:270px;overflow:auto;margin:10px 0}.bubble{max-width:90%;padding:10px;border-radius:12px;background:#fff1;font-size:12px;line-height:1.45}.bubble.user{margin-left:auto;color:#06111e;background:linear-gradient(135deg,var(--main),var(--second))}.hidden{display:none!important}@media(max-height:730px){.pocket{min-height:650px;height:94vh}.content h2{font-size:39px}.desc{font-size:12px}.format-caption{display:none}}
  </style>
</head>
<body>
  <main class="stage"><section class="pocket" id="pocket"><div id="app" class="app"><p>Preparando WebPocket…</p></div></section></main>
  <script>
    /* Esta versión no guarda tokens de Supabase ni OpenRouter en GitHub. */
    const EDGE_FUNCTION_URL = 'https://rrubzwdrsuyjntoejmew.supabase.co/functions/v1/webpocket-api';
    const VIDEO_BY_DEMO = ['video_cvoficina.mp4','video_cvlimpieza.mp4','video_cvdoctor.mp4','video_cvcontruccion.mp4','video_negocio1.mp4','video_negocio2.mp4','video_negocio3.mp4','video_negocio4.mp4'];
    const IMAGE_BY_DEMO = ['webpocket-picarones.jpg','webpocket-pizza.jpg','webpocket-mecanica.jpg','webpocket-polos.jpg'];
    const FALLBACK_FORMATS = Array.from({length:20},(_,i)=>({id:`demo-${i+1}`,nombre:['Horizonte Profesional','Neon Pocket','Tienda Lateral','Tik Pocket','Carrusel Horizontal','Tarjetas Apiladas','Minimal Blanco','Retro Cálido','Lima Urbana','Salud Serena'][i%10],posicion_navegacion:['superior','flotante_derecha','lateral_izquierda','lateral_derecha','inferior','superior','superior','inferior_fijo'][i%8],estilo_botones:['redondeados','neon','cuadrados','circulares','pildora'][i%5],color_principal:['#60a5fa','#00f5d4','#fb923c','#fe2c55','#a78bfa','#34d399','#e2e8f0','#fbbf24'][i%8],color_secundario:['#c4b5fd','#f15bb5','#fed7aa','#25f4ee','#ddd6fe','#6ee7b7','#94a3b8','#f97316'][i%8],color_fondo:['#07101e','#09090b','#1c1917','#000','#171129','#06291e','#0b1220','#251705'][i%8],color_texto:'#f8fafc'}));
    const DEMOS = [
      {numero_perfil:1,nombre:'Alejandro Salazar',categoria:'Asistente administrativo',descripcion:'Orden, comunicación clara y soluciones prácticas para oficinas que avanzan.',direccion:'Pueblo Libre, Lima',tipo_perfil:'CV',video:VIDEO_BY_DEMO[0],formatIndex:0,preguntas:[['¿Cuál es tu especialidad?','Asistencia administrativa, coordinación y organización de procesos.'],['¿Qué herramientas manejas?','Excel, Google Workspace y atención de clientes.']]},
      {numero_perfil:2,nombre:'Marco Huamán',categoria:'Operario de limpieza',descripcion:'Responsable, puntual y enfocado en espacios seguros y ordenados.',direccion:'San Juan de Lurigancho, Lima',tipo_perfil:'CV',video:VIDEO_BY_DEMO[1],formatIndex:1,preguntas:[['¿Qué experiencia tienes?','Experiencia en limpieza residencial, oficinas y áreas comunes.'],['¿Tienes disponibilidad?','Sí, coordino horarios según la necesidad del servicio.']]},
      {numero_perfil:3,nombre:'Dr. Mateo Valdivia',categoria:'Médico general',descripcion:'Orientación clara y atención respetuosa enfocada en la prevención.',direccion:'Santiago de Surco, Lima',tipo_perfil:'CV',video:VIDEO_BY_DEMO[2],formatIndex:9,chat:true},
      {numero_perfil:4,nombre:'Carlos Quispe',categoria:'Maestro de obra',descripcion:'Construcción, acabados y remodelaciones con coordinación directa.',direccion:'Villa El Salvador, Lima',tipo_perfil:'CV',video:VIDEO_BY_DEMO[3],formatIndex:8,preguntas:[['¿Qué trabajos realizas?','Construcción, acabados, enchapes, pintura y remodelaciones.'],['¿Cómo cotizas?','Visito el proyecto o reviso medidas para entregar una cotización clara.']]},
      {numero_perfil:5,nombre:'Dulce Antojo Limeño',categoria:'Picarones peruanos',descripcion:'Picarones artesanales recién hechos para reuniones y antojos.',direccion:'Breña, Lima',tipo_perfil:'NEGOCIO',video:VIDEO_BY_DEMO[4],formatIndex:7,products:['Picarones clásicos','Picarones con miel extra','Combo familiar','Caja para evento','Miel casera']},
      {numero_perfil:6,nombre:'Forno Notte',categoria:'Pizzería artesanal',descripcion:'Pizzas de masa artesanal, preparadas al momento y con sabor de barrio.',direccion:'Jesús María, Lima',tipo_perfil:'NEGOCIO',video:VIDEO_BY_DEMO[5],formatIndex:4,products:['Pizza margarita','Pizza pepperoni','Pizza vegetariana','Combo familiar','Gaseosa personal']},
      {numero_perfil:7,nombre:'Torque Andino',categoria:'Taller automotriz',descripcion:'Mantenimiento automotriz explicado sin complicaciones y con atención directa.',direccion:'Ate, Lima',tipo_perfil:'NEGOCIO',video:VIDEO_BY_DEMO[6],formatIndex:2,products:['Cambio de aceite','Revisión de frenos','Alineamiento','Diagnóstico general','Cambio de batería'],gallery:['https://www.youtube.com/watch?v=5J7qA7vSxjs','https://www.youtube.com/watch?v=0M89zxnZ3c8']},
      {numero_perfil:8,nombre:'Tinta Urbana',categoria:'Polos personalizados',descripcion:'Diseños personalizados para equipos, emprendimientos y celebraciones.',direccion:'Los Olivos, Lima',tipo_perfil:'NEGOCIO',video:VIDEO_BY_DEMO[7],formatIndex:3,products:['Polo personalizado básico','Polo full color','Polo para equipo','Polo infantil','Diseño adicional'],gallery:['https://www.youtube.com/watch?v=QChut41O2rY']}
    ];
    const state={formats:[],profiles:[],products:[],questions:[],links:[],index:0,panel:null,cart:{},plans:[],notice:'',noticeType:'',serviceOk:false,serviceIA:false};
    const app=document.querySelector('#app'),pocket=document.querySelector('#pocket');
    const esc=v=>String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const ready=()=>Boolean(EDGE_FUNCTION_URL);
    const edge=async(body)=>{const response=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json().catch(()=>({error:'La función Edge respondió sin JSON.'}));if(!response.ok||data.error)throw Error(data.error||'No se pudo completar la operación.');return data};
    const code=p=>p.codigo_cliente||`demo-${p.numero_perfil}`;
    const title=p=>p.negocio||p.nombre||'WebPocket';
    const description=p=>p.perfil||p.descripcion||'Perfil publicado desde WebPocket.';
    const format=p=>state.formats.find(f=>f.id===p.formato_id)||state.formats[p.formatIndex%state.formats.length]||FALLBACK_FORMATS[0];
    const colors=p=>{const f=format(p);return{main:p.color_principal||f.color_principal||'#38bdf8',second:p.color_secundario||f.color_secundario||'#a78bfa',bg:p.color_fondo||f.color_fondo||'#07101e',text:p.color_texto||f.color_texto||'#f8fafc'}};
    const video=p=>p.urlvideo_aprobado||p.urlvideo||p.video||VIDEO_BY_DEMO[(p.numero_perfil||1)-1]||VIDEO_BY_DEMO[0];
    const qFor=p=>p.preguntas||state.questions.filter(q=>q.codigo_cliente===code(p));
    const productsFor=p=>p.products||state.products.filter(x=>x.codigo_cliente===code(p));
    const linksFor=p=>p.gallery||state.links.filter(x=>x.codigo_cliente===code(p)&&/youtube/i.test(`${x.tipo_enlace} ${x.url} ${x.valor_enlace}`)).map(x=>x.url||x.valor_enlace);
    const embed=url=>{try{const u=new URL(url);const id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop();return id?`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}`:''}catch{return''}};
    function menuClass(p){const f=format(p),pos=`${f.posicion_navegacion||''} ${f.tipo_menu||''} ${f.estilo_navegacion||''}`.toLowerCase();if(pos.includes('derecha')&&pos.includes('lateral'))return'side-right';if(pos.includes('izquierda')&&pos.includes('lateral'))return'side';if(pos.includes('flotante')&&pos.includes('derecha'))return'floating-right';if(pos.includes('flotante')&&pos.includes('izquierda'))return'floating-left';if(pos.includes('inferior'))return'bottom';if(pos.includes('centr'))return'centered';return''}
    function setNotice(text='',type=''){state.notice=text;state.noticeType=type}
    function current(){return state.profiles[state.index]}
    function renderPanel(p){if(!state.panel)return'';const close='<button class="close" data-close aria-label="Cerrar">×</button>';if(state.panel==='questions'){const qs=qFor(p);return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">PREGUNTAS CONFIGURADAS</span><h3>Pregúntame</h3></div>${close}</div><div class="card-list">${qs.map(q=>`<article class="card"><b>${esc(q.pregunta||q[0])}</b><p>${esc(q.respuesta||q[1]||'Respuesta disponible pronto.')}</p></article>`).join('')||'<p>No hay preguntas públicas todavía.</p>'}</div></section></aside>`}if(state.panel==='products'){const products=productsFor(p).map((x,i)=>typeof x==='string'?{descripcion:x,precio:[12,18,28,35,9][i]||15,foto:IMAGE_BY_DEMO[Math.max(0,(p.numero_perfil||5)-5)%4]}:x);const total=Object.entries(state.cart).reduce((n,[id,qty])=>n+qty*(products.find(x=>(x.descripcion||'')===id)?.precio||0),0);return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">CARRITO DE MUESTRA</span><h3>${esc(title(p))}</h3></div>${close}</div><div class="card-list">${products.map(x=>{const qty=state.cart[x.descripcion]||0;return `<article class="card product"><img src="${esc(x.foto||IMAGE_BY_DEMO[Math.max(0,(p.numero_perfil||5)-5)%4])}" alt="${esc(x.descripcion)}"><div><b>${esc(x.descripcion)}</b><p>S/ ${Number(x.precio||0).toFixed(2)}</p><div class="qty"><button data-qty="-" data-id="${esc(x.descripcion)}">−</button><span>${qty}</span><button data-qty="+" data-id="${esc(x.descripcion)}">+</button></div></div></article>`}).join('')}</div><div class="price-box"><strong>S/ ${total.toFixed(2)}</strong><p>Al continuar se preparará el mensaje con tus productos y cantidades para el WhatsApp del negocio.</p><button class="submit" data-order>Ver pedido seleccionado</button></div></section></aside>`}if(state.panel==='gallery'){const videos=linksFor(p).map(embed).filter(Boolean);return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">VIDEOS DEL PERFIL</span><h3>Galería</h3></div>${close}</div><div class="gallery">${videos.map(src=>`<iframe src="${src}" allowfullscreen loading="lazy" title="Video del perfil"></iframe>`).join('')||'<p>Este perfil todavía no tiene videos públicos.</p>'}</div></section></aside>`}if(state.panel==='chat'){return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">CHAT IA</span><h3>Orientación general</h3></div>${close}</div><p class="message">Este chat brinda información general y no reemplaza una evaluación médica, diagnóstico, tratamiento o atención de urgencia.</p><div id="chat-log" class="chat-log"><div class="bubble">Hola. Puedo ofrecer orientación general sobre prevención y controles. Si presentas síntomas graves, busca atención de urgencia.</div></div><form id="chat-form" class="form"><div class="grid2"><input name="question" placeholder="Escribe una consulta general" aria-label="Consulta general"><button class="submit">Enviar</button></div></form></section></aside>`}if(state.panel==='register')return registerSheet();if(state.panel==='login')return loginSheet();return''}
    function registerSheet(){const f=state.formats[0]||FALLBACK_FORMATS[0];return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">NUEVO PERFIL</span><h3>Regístrate en WebPocket</h3></div><button class="close" data-close>×</button></div><p>Completa tus datos, elige un formato y registra tu solicitud. El pago será validado manualmente antes de activar el perfil.</p><form id="register-form" class="form"><div class="grid2"><div class="field"><label>Tipo de perfil</label><select name="tipoPerfil"><option value="CV">CV personal</option><option value="NEGOCIO">Negocio</option></select></div><div class="field"><label>Periodo</label><select name="periodoMeses"><option value="3">3 meses</option><option value="6">6 meses</option><option value="12">1 año</option></select></div></div><div class="field"><label>Nombre completo</label><input name="nombre" placeholder="Escribe tu nombre"></div><div class="grid2"><div class="field"><label>Correo</label><input name="correo" type="email" placeholder="correo@ejemplo.com"></div><div class="field"><label>Teléfono</label><input name="telefono" placeholder="Número de contacto"></div></div><div class="field"><label>Dirección</label><input name="direccion" placeholder="Distrito y dirección"></div><div class="grid2"><div class="field"><label>Usuario</label><input name="usuario" placeholder="Crea tu usuario"></div><div class="field"><label>Clave</label><input name="clave" type="password" placeholder="Crea tu clave"></div></div><div class="field"><label>Negocio o especialidad</label><input name="negocio" placeholder="Opcional para CV"></div><div class="field"><label>Descripción del perfil</label><textarea name="perfil" placeholder="Cuéntale al público sobre ti, tu servicio o tu negocio"></textarea></div><div class="field"><label>Formato</label><select name="formatoId">${state.formats.map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join('')||`<option value="${esc(f.id)}">${esc(f.nombre)}</option>`}</select></div><div class="colors"><div class="field"><label>Color principal</label><input name="principal" type="color" value="${esc(f.color_principal||'#38bdf8')}"></div><div class="field"><label>Color secundario</label><input name="secundario" type="color" value="${esc(f.color_secundario||'#a78bfa')}"></div><div class="field"><label>Fondo</label><input name="fondo" type="color" value="${esc(f.color_fondo||'#07101e')}"></div></div><div class="field"><label>Videos de YouTube</label><textarea name="youtubeLinks" placeholder="Pega una URL por línea. Opcional."></textarea></div><div class="price-box"><span class="eyebrow">PAGO POR YAPE</span><strong id="total-price">S/ 40.00</strong><p id="price-detail">CV por 3 meses. Yape: 967 188 120. La validación es manual.</p></div><p id="register-message" class="message hidden"></p><button class="submit">Generar mi QR y registrar solicitud</button></form></section></aside>`}
    function loginSheet(){return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">ACCESO</span><h3>Ingreso de cliente o administrador</h3></div><button class="close" data-close>×</button></div><form id="login-form" class="form"><div class="field"><label>Usuario</label><input name="usuario" placeholder="Tu usuario"></div><div class="field"><label>Clave</label><input name="clave" type="password" placeholder="Tu clave"></div><p id="login-message" class="message hidden"></p><button class="submit" style="background:linear-gradient(135deg,#4ade80,#22c55e)">Ingresar</button></form></section></aside>`}

ans.find(p=>String(p.tipo_perfil).toUpperCase()===type&&Number(p.duracion_meses)===period);const fallback=type==='CV'?(period===3?40:period===6?50:80):(period===3?50:period===6?80:100);const amount=Number(found?.precio_base??fallback);app.querySelector('#total-price').textContent=`S/ ${amount.toFixed(2)}`;app.querySelector('#price-detail').textContent=`${type==='CV'?'CV virtual':'Negocio Pocket'} por ${period} meses. Yape: 967 188 120. La validación es manual.`;register.dataset.total=String(amount)};register.elements.tipoPerfil.addEventListener('change',updatePrice);register.elements.periodoMeses.addEventListener('change',updatePrice);updatePrice();register.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(register),message=app.querySelector('#register-message');const profile={tipoPerfil:data.get('tipoPerfil'),periodoMeses:Number(data.get('periodoMeses')),nombre:data.get('nombre'),correo:data.get('correo'),telefono:data.get('telefono'),direccion:data.get('direccion'),usuario:data.get('usuario'),clave:data.get('clave'),negocio:data.get('negocio'),perfil:data.get('perfil'),formatoId:data.get('formatoId'),colores:{principal:data.get('principal'),secundario:data.get('secundario'),fondo:data.get('fondo')},youtubeLinks:String(data.get('youtubeLinks')||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean),total:Number(register.dataset.total||0)};message.className='message';message.textContent='Guardando solicitud…';try{if(!ready())throw Error('Pega la clave pública de Supabase en el encabezado del HTML.');const result=await edge({action:'register',profile});message.className='message ok';message.textContent=`Solicitud registrada. Código: ${result.codigoCliente}. Tu QR quedará disponible tras la validación manual del pago.`}catch(error){message.className='message error';message.textContent=error.message}})}const login=app.querySelector('#login-form');if(login)login.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(login     };
    const adminSheet = () => { const a = state.account || {}, clients = a.clients || [], payments = a.payments || []; return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">ADMINISTRACIÓN</span><h3>Pagos, clientes y precios</h3></div><button class="close" data-close>×</button></div><p>Revisa el comprobante, activa el cliente y sube el video aprobado desde aquí.</p><div class="card-list">${clients.map(c => `<article class="card"><b>${esc(c.nombre || c.negocio || c.usuario)} · ${esc(c.codigo_cliente)}</b><p>${c.activo ? "Activo" : "Pendiente"} · ${esc(c.tipo_perfil)}</p><div class="grid2"><button class="action" data-activate="${esc(c.codigo_cliente)}" data-active="${c.activo ? "0" : "1"}">${c.activo ? "Desactivar" : "Activar tras validar pago"}</button><button class="action" data-admin-video="${esc(c.codigo_cliente)}">Subir video aprobado</button></div></article>`).join("") || "<p>No hay clientes.</p>"}</div><form id="admin-video-form" class="form hidden"><div class="field"><label>Video aprobado</label><input name="file" type="file" accept="video/mp4,video/webm"></div><input name="codigoCliente" type="hidden"><button class="submit">Guardar video para cliente</button></form><h3 style="margin-top:16px">Comprobantes</h3><div class="card-list">${payments.map(p => `<article class="card"><b>${esc(p.codigo_cliente)} · S/ ${Number(p.importe || 0).toFixed(2)}</b><p>${esc(p.estado_pago)}</p>${p.url_comprobante ? `<a href="${esc(p.url_comprobante)}" target="_blank" rel="noreferrer">Ver o descargar comprobante</a>` : ""}${String(p.estado_pago || "").startsWith("PENDIENTE_") ? `<button class="action" data-extra-approve="${esc(p.codigo_cliente)}" data-extra-type="${esc(p.estado_pago)}">Aprobar servicio adicional</button>` : ""}</article>`).join("")}</div><h3 style="margin-top:16px">Precios de servicios</h3><form id="plans-form" class="form">${(a.plans || []).map(p => `<div class="card"><b>${esc(p.nombre)} · ${p.duracion_meses} meses</b><div class="grid2"><div class="field"><label>Base</label><input name="base-${esc(p.id)}" type="number" value="${Number(p.precio_base || 0)}"></div><div class="field"><label>IA</label><input name="ia-${esc(p.id)}" type="number" value="${Number(p.precio_ia || 10)}"></div><div class="field"><label>Carrito</label><input name="cart-${esc(p.id)}" type="number" value="${Number(p.precio_carrito || 10)}"></div><div class="field"><label>Producto adicional</label><input name="product-${esc(p.id)}" type="number" value="${Number(p.precio_producto_adicional || 5)}"></div></div></div>`).join("")}<button class="submit">Guardar precios</button></form></section></aside>`; };
    window.renderPanel = function (p) { if (state.panel === "account") return accountSheet(); return basePanel(p); };
    window.bind = function () {
      baseBind();
      const activeProfile = state.profiles?.[state.index], activeFormat = activeProfile ? format(activeProfile) : null, formatCaption = app.querySelector(".format-caption");
      if (formatCaption && activeFormat) formatCaption.textContent = state.serviceOk ? `FORMATO SUPABASE · ${activeFormat.nombre || "Sin nombre"} · ${activeFormat.posicion_navegacion || activeFormat.estilo_navegacion || "Distribución dinámica"}` : `FORMATO DE MUESTRA · ${activeFormat.nombre || "Respaldo local"} · ${activeFormat.posicion_navegacion || "Distribución dinámica"}`;
      const quick = app.querySelector("#quick-register-form"); if (quick) { const updatePrice = () => { const type = quick.elements.tipoPerfil.value, months = Number(quick.elements.periodoMeses.value), plan = state.plans.find(p => String(p.tipo_perfil).toUpperCase() === type && Number(p.duracion_meses) === months), fallback = type === "CV" ? ({3:40,6:50,12:80}[months]) : ({3:50,6:80,12:100}[months]), base = Number(plan?.precio_base ?? fallback), cart = type === "NEGOCIO" && quick.elements.carrito?.checked, cartPrice = cart ? Number(plan?.precio_carrito ?? 10) : 0, total = base + cartPrice, box = app.querySelector("#business-cart-choice"); box?.classList.toggle("hidden", type !== "NEGOCIO"); app.querySelector("#quick-total").textContent = `S/ ${total.toFixed(2)}`; app.querySelector("#quick-detail").textContent = `${type === "CV" ? "CV virtual" : "Negocio Pocket"} por ${months} meses${cart ? " + carrito" : ""}. Yape: 967 188 120.`; }; quick.elements.tipoPerfil.addEventListener("change", updatePrice); quick.elements.periodoMeses.addEventListener("change", updatePrice); quick.elements.carrito?.addEventListener("change", updatePrice); updatePrice(); quick.addEventListener("submit", async e => { e.preventDefault(); const form = e.currentTarget, fd = new FormData(form); try { notice("#quick-register-message", "Subiendo comprobante…"); const file = fd.get("receipt"); const uploaded = await edge({ action: "upload_receipt", fileData: await readDataUrl(file), fileName: file.name }); const result = await edge({ action: "register", registration: { usuario: fd.get("usuario"), clave: fd.get("clave"), tipoPerfil: fd.get("tipoPerfil"), periodoMeses: Number(fd.get("periodoMeses")), carrito: fd.get("carrito") === "on", formatoId: fd.get("formatoId"), colores: { principal: fd.get("principal"), secundario: fd.get("secundario"), fondo: fd.get("fondo") }, receipt: uploaded.file } }); notice("#quick-register-message", `Solicitud registrada. Código ${result.codigoCliente}. Espera la validación manual del pago.`, "ok"); } catch (error) { notice("#quick-register-message", error.message, "error"); } }); }
      app.querySelector("#access-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget); try { const result = await edge({ action: "login", usuario: fd.get("usuario"), clave: fd.get("clave") }); state.auth = result; state.account = result.role === "admin" ? await send({ action: "admin_get" }) : await send({ action: "client_get" }); state.panel = "account"; render(); } catch (error) { notice("#access-message", error.message, "error"); } });
      app.querySelectorAll("[data-account-tab]").forEach(button => button.addEventListener("click", () => { const body = app.querySelector("#account-body"); if (body) body.innerHTML = accountTab(button.dataset.accountTab); bind(); }));
      app.querySelectorAll("[data-add-entry]").forEach(button => button.addEventListener("click", () => { const key = button.dataset.addEntry, label = button.dataset.entryLabel, box = app.querySelector(`[data-list-box="${key}"]`), row = document.createElement("div"); row.className = "grid2"; row.innerHTML = `<input data-list-input="${key}" placeholder="${esc(label)}"><button type="button" class="action" data-remove-entry="${key}">Quitar</button>`; box.appendChild(row); bind(); }));
      app.querySelectorAll("[data-remove-entry]").forEach(button => button.addEventListener("click", () => { const box = button.closest("[data-list-box]"); if (box && box.children.length > 1) button.parentElement.remove(); else if (button.parentElement?.querySelector("input")) button.parentElement.querySelector("input").value = ""; }));
      app.querySelector("#profile-save-form")?.addEventListener("submit", async e => { e.preventDefault(); const form = e.currentTarget; ["estudios", "experiencia"].forEach(key => { const hidden = form.querySelector(`[name="${key}"]`); if (hidden) hidden.value = [...form.querySelectorAll(`[data-list-input="${key}"]`)].map(input => input.value.trim()).filter(Boolean).join("\n"); }); const fd = new FormData(form); try { await send({ action: "client_save", profile: Object.fromEntries(fd) }); alert("Datos guardados. Permanecerán aquí para que puedas modificarlos cuando quieras."); } catch (error) { alert(error.message); } });
      app.querySelector("#media-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget), file = fd.get("file"); try { await send({ action: "client_upload", kind: fd.get("kind"), fileData: await readDataUrl(file), fileName: file.name }); alert("Archivo guardado."); } catch (error) { alert(error.message); } });
      app.querySelector("#questions-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget), rows = String(fd.get("questions") || "").split("\n").map(line => { const [pregunta, respuesta] = line.split("|"); return { pregunta: pregunta?.trim(), respuesta: respuesta?.trim() }; }); try { await send({ action: "client_save_questions", mode: fd.get("mode"), questions: rows, knowledge: fd.get("knowledge"), prompt: fd.get("prompt") }); alert("Preguntas guardadas."); } catch (error) { alert(error.message); } });
      app.querySelector("#youtube-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget); try { await send({ action: "client_save_youtube", links: String(fd.get("links") || "").split(/\n|,/).map(x => x.trim()).filter(Boolean) }); alert("Galería guardada."); } catch (error) { alert(error.message); } });
      app.querySelector("#products-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget), products = String(fd.get("products") || "").split("\n").map(line => { const [descripcion, precio, stock, foto] = line.split("|"); return { descripcion: descripcion?.trim(), precio: Number(precio), stock: Number(stock), foto: foto?.trim() }; }); try { await send({ action: "client_save_products", products }); alert("Carrito guardado."); } catch (error) { alert(error.message); } });
      app.querySelector("#extra-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget), file = fd.get("receipt"); try { const uploaded = await edge({ action: "upload_receipt", fileData: await readDataUrl(file), fileName: file.name }); const result = await send({ action: "request_extra", type: fd.get("type"), quantity: fd.get("quantity"), receipt: uploaded.file }); alert(`Solicitud enviada. Importe: S/ ${Number(result.importe).toFixed(2)}`); } catch (error) { alert(error.message); } });
      app.querySelectorAll("[data-activate]").forEach(button => button.addEventListener("click", async () => { try { await send({ action: "admin_activate", codigoCliente: button.dataset.activate, active: button.dataset.active === "1" }); state.account = await send({ action: "admin_get" }); render(); } catch (error) { alert(error.message); } }));
      app.querySelectorAll("[data-extra-approve]").forEach(button => button.addEventListener("click", async () => { try { await send({ action: "admin_approve_extra", codigoCliente: button.dataset.extraApprove, type: button.dataset.extraType }); state.account = await send({ action: "admin_get" }); render(); } catch (error) { alert(error.message); } }));
      app.querySelectorAll("[data-admin-video]").forEach(button => button.addEventListener("click", () => { const form = app.querySelector("#admin-video-form"); form.classList.remove("hidden"); form.elements.codigoCliente.value = button.dataset.adminVideo; form.scrollIntoView({ behavior: "smooth" }); }));
      app.querySelector("#admin-video-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget), file = fd.get("file"); try { await send({ action: "admin_video", codigoCliente: fd.get("codigoCliente"), fileData: await readDataUrl(file), fileName: file.name }); alert("Video aprobado guardado."); } catch (error) { alert(error.message); } });
      app.querySelector("#plans-form")?.addEventListener("submit", async e => { e.preventDefault(); const fd = new FormData(e.currentTarget), list = (state.account?.plans || []).map(p => ({ ...p, precio_base: Number(fd.get(`base-${p.id}`)), precio_ia: Number(fd.get(`ia-${p.id}`)), precio_carrito: Number(fd.get(`cart-${p.id}`)), precio_producto_adicional: Number(fd.get(`product-${p.id}`)) })); try { await send({ action: "admin_plans", plans: list }); alert("Precios guardados."); } catch (error) { alert(error.message); } });
    };
  })();
  </script>
